/* ---------- Kontrol orbit kustom ---------- */
function makeControls(dom,cam,opts){
  opts=opts||{};
  const st={theta:opts.theta!==undefined?opts.theta:.85,phi:opts.phi!==undefined?opts.phi:1.05,dist:opts.dist||26,minD:opts.minD||3,maxD:opts.maxD||220,target:opts.target||new THREE.Vector3(0,0,0)};
  let drag=false,px=0,py=0,pinch0=0;
  const apply=()=>{ cam.position.set(
    st.target.x+st.dist*Math.sin(st.phi)*Math.cos(st.theta),
    st.target.y+st.dist*Math.cos(st.phi),
    st.target.z+st.dist*Math.sin(st.phi)*Math.sin(st.theta));
    cam.lookAt(st.target); };
  dom.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;dom.setPointerCapture&&dom.setPointerCapture(e.pointerId);});
  dom.addEventListener('pointermove',e=>{
    if(!drag) return;
    st.theta+=(e.clientX-px)*.006; st.phi=clamp(st.phi-(e.clientY-py)*.006,.08,Math.PI-.4);
    px=e.clientX;py=e.clientY;apply();
  });
  addEventListener('pointerup',()=>drag=false);
  dom.addEventListener('wheel',e=>{ e.preventDefault(); st.dist=clamp(st.dist*(1+Math.sign(e.deltaY)*.09),st.minD,st.maxD); apply(); },{passive:false});
  dom.addEventListener('touchstart',e=>{ if(e.touches.length===2) pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:true});
  dom.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch0){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); st.dist=clamp(st.dist*(pinch0/d),st.minD,st.maxD); pinch0=d; apply(); } },{passive:true});
  apply();
  return {apply,state:st,setView(o){Object.assign(st,o);apply();}};
}

/* ---------- Scene manager ---------- */
function mountScene(container,factory){
  if(STATE.scene&&STATE.scene.stop){ try{STATE.scene.stop();}catch(e){} STATE.scene=null; }
  if(!window.THREE){
    container.innerHTML='<div class="errbox" style="margin:20px">Three.js gagal dimuat dari CDN (mode offline). Visualisasi 3D dinonaktifkan — gunakan peta 2D & grafik yang tetap tersedia, atau sambungkan internet lalu refresh.</div>';
    return null;
  }
  try{ STATE.scene=factory(container); }catch(e){ console.error(e); container.innerHTML='<div class="errbox" style="margin:20px">Gagal inisialisasi WebGL: '+esc(e.message)+'</div>'; STATE.scene=null; }
  return STATE.scene;
}
function disposeScene(scene){
  try{
    scene._raf&&cancelAnimationFrame(scene._raf);
    scene.renderer&&scene.renderer.dispose();
    scene.renderer&&scene.renderer.domElement&&scene.renderer.domElement.remove();
    scene.renderer&&scene.renderer.forceContextLoss&&scene.renderer.forceContextLoss();
  }catch(e){}
}

/* ---------- Globe Bumi interaktif ---------- */
function buildGlobe(container,opts){
  opts=opts||{};
  const W=()=>container.clientWidth||600, H=()=>container.clientHeight||420;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(42,W()/H(),.1,400);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,SET.quality==='high'?1.8:1.1));
  renderer.setSize(W(),H());
  container.appendChild(renderer.domElement);
  // pencahayaan sesuai posisi matahari sesungguhnya (subsolar point)
  const now=new Date();
  const dayMs=(now-Date.UTC(now.getUTCFullYear(),0,1))/864e5;
  const decl=-23.44*Math.cos(2*Math.PI*(dayMs+10)/365.24);
  const subsolarLon=(12-now.getUTCHours()-now.getUTCMinutes()/60)*15;
  const sunDir=new THREE.Vector3(Math.cos(decl*DEG)*Math.cos(subsolarLon*DEG),Math.sin(decl*DEG),Math.cos(decl*DEG)*Math.sin(subsolarLon*DEG)).normalize();
  const sun=new THREE.DirectionalLight(0xffffff,1.25); sun.position.copy(sunDir).multiplyScalar(10); scene.add(sun);
  scene.add(new THREE.AmbientLight(0x8899bb,SET.theme==='light'?.9:.35));
  const group=new THREE.Group(); scene.add(group);
  const earthTex=makeEarthTexture(), nightTex=makeNightTexture();
  const earth=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),new THREE.MeshPhongMaterial({map:earthTex,emissiveMap:nightTex,emissive:new THREE.Color(0xffcc66),emissiveIntensity:.55,shininess:8,specular:new THREE.Color(0x223344)}));
  group.add(earth);
  const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.012,48,48),new THREE.MeshLambertMaterial({map:makeCloudTexture(),transparent:true,opacity:.85,depthWrite:false}));
  group.add(clouds);
  const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.16,32,32),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.05,side:THREE.BackSide,blending:THREE.AdditiveBlending}));
  scene.add(atmo);
  // bintang latar
  const starN=SET.quality==='low'?600:2200, pos=new Float32Array(starN*3);
  for(let i=0;i<starN;i++){ pos[i*3]=rand(-90,90);pos[i*3+1]=rand(-90,90);pos[i*3+2]=rand(-90,90); }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x9fb8ff,size:.28,sizeAttenuation:true,transparent:true,opacity:.8})));
  // satelit (dari dataset aktif)
  const satObjs=[];
  (opts.satellites||[]).forEach((s,i)=>{
    const isDeb=s.status==='Debris'||s.status==='Decommissioned';
    const col=isDeb?0xff5577:(s.orbit==='GEO'?0xffb020:0x00e676);
    const m=new THREE.Mesh(new THREE.SphereGeometry(.016,8,8),new THREE.MeshBasicMaterial({color:col}));
    m.userData={type:'sat',sat:s};
    scene.add(m); satObjs.push(m);
  });
  // marker (bencana/vulkan dsb)
  const markerObjs=[];
  (opts.markers||[]).forEach(mk=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlowTexture(mk.color||'#ff3b5c'),transparent:true,depthTest:false}));
    sp.scale.set(.11,.11,1); sp.userData={type:'marker',marker:mk};
    scene.add(sp); markerObjs.push(sp);
  });
  // helper konversi lat/lon → posisi 3D
  const toXYZ=(lat,lon,r)=>{
    const la=lat*DEG,lo=lon*DEG;
    return new THREE.Vector3(r*Math.cos(la)*Math.cos(lo),r*Math.sin(la),-r*Math.cos(la)*Math.sin(lo));
  };
  const ctr=makeControls(renderer.domElement,cam,{theta:.6,phi:1.15,dist:3.4,minD:1.6,maxD:14});
  let spin=opts.autoSpin!==false && SET.anim, t0=performance.now(), frames=0;
  const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
  const onClick=e=>{
    const rect=renderer.domElement.getBoundingClientRect();
    mv.x=((e.clientX-rect.left)/rect.width)*2-1; mv.y=-((e.clientY-rect.top)/rect.height)*2+1;
    ray.setFromCamera(mv,cam);
    const hits=ray.intersectObjects(satObjs.concat(markerObjs));
    if(hits.length){
      const u=hits[0].object.userData;
      if(u.type==='sat'&&opts.onSat) opts.onSat(u.sat);
      if(u.type==='marker'&&opts.onMarker) opts.onMarker(u.marker);
      return;
    }
    const hit=ray.intersectObject(earth)[0];
    if(hit&&opts.onEarth){
      const p=hit.point.clone().normalize();
      const lat=Math.asin(p.y)/DEG;
      let lon=Math.atan2(-p.z,p.x)/DEG;
      const rot=group.rotation.y; lon=lon+rot/DEG; lon=((lon+540)%360)-180;
      opts.onEarth(lat,lon);
    }
  };
  renderer.domElement.addEventListener('click',onClick);
  const resize=()=>{ const w=W(),h=H(); cam.aspect=w/h; cam.updateProjectionMatrix(); renderer.setSize(w,h); };
  addEventListener('resize',resize);
  const anim=()=>{
    const t=(performance.now()-t0)/1000;
    if(spin&&SET.anim){ group.rotation.y=t*.05; clouds.rotation.y=t*.065; }
    satObjs.forEach((m,i)=>{
      const s=m.userData.sat;
      if(s.lat===null||s.lat===undefined){ m.visible=false; return; }
      if(s.orbit==='L1'||s.orbit==='L2'){ m.visible=false; return; }
      const g=groundFor(s,Date.now());
      const r=typeof s.alt==='number'?1+(s.alt/6371)*.9:1.1;
      m.position.copy(toXYZ(g.lat,g.lon,r));
      m.position.applyAxisAngle(new THREE.Vector3(0,1,0),group.rotation.y);
    });
    markerObjs.forEach(sp=>{
      const mk=sp.userData.marker;
      sp.position.copy(toXYZ(mk.lat,mk.lon,1.03));
      sp.position.applyAxisAngle(new THREE.Vector3(0,1,0),group.rotation.y);
    });
    renderer.render(scene,cam);
    scene._raf=requestAnimationFrame(anim);
  };
  anim();
  return {
    scene,cam,renderer,
    stop(){ disposeScene(this); removeEventListener('resize',resize); },
    setSpin(v){spin=v;}, getGroup(){return group;}, toXYZ, resize
  };
}

/* ---------- Tata Surya interaktif 3D ---------- */
function buildSolar(container,planetModal){
  const W=()=>container.clientWidth||700, H=()=>container.clientHeight||520;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(48,W()/H(),.1,4000);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,SET.quality==='high'?1.7:1));
  renderer.setSize(W(),H());
  container.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x607090,.55));
  const sunLight=new THREE.PointLight(0xffdca0,2.2,2000); scene.add(sunLight);
  const AUu=AU_SCALE; // skala kompresi visual (global, 04b_realtime.js)
  // matahari
  const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(5,48,48),new THREE.MeshBasicMaterial({color:0xffc860}));
  scene.add(sunMesh);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlowTexture('#ffb020'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.scale.set(26,26,1); scene.add(glow);
  // planet
  const planets=[],picking=[];
  PLANETS.filter(p=>p.r>0&&!p.parent&&!p.comet).forEach(p=>{
    const g=new THREE.Group();
    const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(p.color),emissive:new THREE.Color(p.color).multiplyScalar(.22),shininess:6});
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(p.r,32,32),mat);
    mesh.userData={planet:p}; picking.push(mesh);
    g.add(mesh);
    if(p.ring){
      const ring=new THREE.Mesh(new THREE.RingGeometry(p.r*1.45,p.r*2.35,48),new THREE.MeshBasicMaterial({color:0xd8c8a0,transparent:true,opacity:.5,side:THREE.DoubleSide}));
      ring.rotation.x=Math.PI/2.2; g.add(ring);
    }
    const label=makeLabelSprite(p.name,'#7dd3fc');
    label.position.y=p.r+1.3; label.visible=false; g.add(label);
    const orbitPts=KEPL[p.id]?keplerOrbitScene(p.id):null; // garis orbit = elips nyata
    const orbit=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
      orbitPts||Array.from({length:128},(_,i)=>{ const a=i/128*6.283; return new THREE.Vector3(Math.cos(a)*AUu(p.au),0,Math.sin(a)*AUu(p.au)); })),
      new THREE.LineBasicMaterial({color:0x2266aa,transparent:true,opacity:.35}));
    scene.add(orbit);
    scene.add(g);
    planets.push({p,group:g,label,phase:rand(0,6.283)});
    if(p.id==='earth'){
      const moon=planetById('moon');
      const mOrbit=new THREE.Group();
      const mMesh=new THREE.Mesh(new THREE.SphereGeometry(moon.r,16,16),new THREE.MeshPhongMaterial({color:0xc9c4bd}));
      mMesh.userData={planet:moon}; picking.push(mMesh);
      mOrbit.add(mMesh);
      const mLab=makeLabelSprite('Bulan','#cbd5e1'); mLab.position.y=.6; mLab.visible=false; mOrbit.add(mLab);
      const mRing=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
        Array.from({length:64},(_,i)=>{ const a=i/64*6.283; return new THREE.Vector3(Math.cos(a)*1.35,0,Math.sin(a)*1.35); })),
        new THREE.LineBasicMaterial({color:0x5577aa,transparent:true,opacity:.4}));
      g.add(mRing);
      g.add(mOrbit);
      planets.push({p:moon,group:mOrbit,label:mLab,phase:rand(0,6.283),local:true,radius:1.35,rotY:13.4});
    }
  });
  // sabuk asteroid & kuiper
  const mkRingPoints=(n,rIn,rOut,col,thick)=>{
    const pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const a=rand(0,6.283), r=rand(rIn,rOut);
      pos[i*3]=Math.cos(a)*r; pos[i*3+1]=rand(-thick,thick); pos[i*3+2]=Math.sin(a)*r;
    }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    return new THREE.Points(g,new THREE.PointsMaterial({color:col,size:.14,transparent:true,opacity:.75,sizeAttenuation:true}));
  };
  const beltN=SET.quality==='low'?900:SET.quality==='medium'?1800:3200;
  const belt=mkRingPoints(beltN,AUu(2.1),AUu(3.3),0x9aa7b5,.7); scene.add(belt);
  const kuiper=mkRingPoints(Math.round(beltN*.7),AUu(32),AUu(50),0x6ab0d8,2.2); scene.add(kuiper);
  // komet (orbit elips)
  const cometA=AUu(17.8),cometE=.82;
  const cometPts=Array.from({length:160},(_,i)=>{
    const a=i/160*6.283, r=cometA*(1-cometE*cometE)/(1+cometE*Math.cos(a));
    return new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r);
  });
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(cometPts),new THREE.LineBasicMaterial({color:0x67e8f9,transparent:true,opacity:.35})));
  const cometMesh=new THREE.Mesh(new THREE.SphereGeometry(.16,12,12),new THREE.MeshBasicMaterial({color:0xa5f3fc}));
  scene.add(cometMesh);
  const cometTail=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlowTexture('#67e8f9'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  cometTail.scale.set(3.4,3.4,1); scene.add(cometTail);
  const beltLabel=makeLabelSprite('Sabuk Asteroid','#9aa7b5'); beltLabel.position.set(AUu(2.7),2.2,0); scene.add(beltLabel);
  const kuiperLabel=makeLabelSprite('Sabuk Kuiper','#6ab0d8'); kuiperLabel.position.set(0,2.6,AUu(42)); scene.add(kuiperLabel);
  const ctr=makeControls(renderer.domElement,cam,{theta:.9,phi:.85,dist:150,minD:14,maxD:900});
  let simDays=0,speed=6,paused=false,labels=false,last=performance.now(),baseJd=jdFromDate(Date.now());
  const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
  renderer.domElement.addEventListener('click',e=>{
    const rect=renderer.domElement.getBoundingClientRect();
    mv.x=((e.clientX-rect.left)/rect.width)*2-1; mv.y=-((e.clientY-rect.top)/rect.height)*2+1;
    ray.setFromCamera(mv,cam);
    const hits=ray.intersectObjects(picking);
    if(hits.length&&planetModal) planetModal(hits[0].object.userData.planet);
  });
  const resize=()=>{ const w=W(),h=H(); cam.aspect=w/h; cam.updateProjectionMatrix(); renderer.setSize(w,h); };
  addEventListener('resize',resize);
  const anim=()=>{
    const dt=(performance.now()-last)/1000; last=performance.now();
    if(!paused&&SET.anim) simDays+=dt*speed;
    planets.forEach(o=>{
      const T=(o.p.orbY||1)*365.25;
      if(o.local){
        o.group.position.set(Math.cos(o.phase+simDays/(o.p.orbY*365.25)*6.283)*o.radius,0,Math.sin(o.phase+simDays/(o.p.orbY*365.25)*6.283)*o.radius);
        o.group.rotation.y=simDays*(o.rotY||27);
      } else if(KEPL[o.p.id]){
        const sp=keplerScenePos(o.p.id,baseJd+simDays); // posisi ephemeris nyata (Horizons LIVE bila ada, else Kepler JPL)
        if(sp) o.group.position.set(sp.x,sp.y,sp.z);
        o.group.rotation.y=simDays/(Math.abs(o.p.rot)||24);
      } else {
        const a=o.phase+ (simDays/T)*6.283, R=AUu(o.p.au);
        o.group.position.set(Math.cos(a)*R,0,Math.sin(a)*R);
        o.group.rotation.y=simDays/(Math.abs(o.p.rot)||24);
      }
    });
    const ca=simDays/75.3*6.283, r=cometA*(1-cometE*cometE)/(1+cometE*Math.cos(ca));
    cometMesh.position.set(Math.cos(ca)*r,0,Math.sin(ca)*r);
    cometTail.position.copy(cometMesh.position);
    sunMesh.rotation.y=simDays/25.4*6.283;
    if(labels) planets.forEach(o=>o.label.visible=true); else planets.forEach(o=>o.label.visible=false);
    beltLabel.visible=labels; kuiperLabel.visible=labels;
    renderer.render(scene,cam);
    scene._raf=requestAnimationFrame(anim);
  };
  anim();
  return {
    scene,cam,renderer,
    stop(){ disposeScene(this); removeEventListener('resize',resize); },
    setSpeed(v){speed=v;}, setPaused(v){paused=v;}, setLabels(v){labels=v;},
    reset(){ ctr.setView({theta:.9,phi:.85,dist:150}); },
    topView(){ ctr.setView({theta:0,phi:.02,dist:320}); },
    resize
  };
}

function kpiCard(o){

  return `<div class="kpi ${o.tone||''}" ${o.hidden?'style="display:none"':''}>

    </div>
    ${o.spark?`<div class="chartbox xs spark"><canvas id="${o.spark}"></canvas></div>`:''}

}

async function loadLiveData(force){
  markSource('swpc','NOAA SWPC — Kp Index','SIMULATED','https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json');
  markSource('celesTrak','CelesTrak GP (TLE)','SIMULATED','https://celestrak.org/NORAD/elements/gp.php');
  markSource('nasaNeo','NASA NeoWs','SIMULATED','https://api.nasa.gov/neo/rest/v1/feed');
  markSource('ll2','Launch Library 2','SIMULATED','https://ll.thespacedevs.com/2.2.0/launch/upcoming/');
  markSource('horizons','JPL Horizons — vektor heliosentris','SIMULATED','https://ssd-api.jpl.nasa.gov/horizons.api');
  markSource('probes','Probe antarpelanet (Horizons)','SIMULATED','https://ssd-api.jpl.nasa.gov/horizons.api');
  markSource('exoplanets','NASA Exoplanet Archive (TAP)','SIMULATED','https://exoplanetarchive.ipac.caltech.edu/TAP/sync');
  markSource('dscovr','NOAA SWPC — DSCOVR & GOES','SIMULATED','https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json');
  markSource('eonet','NASA EONET — event geofisika','SIMULATED','https://eonet.gsfc.nasa.gov/api/v3/events');
  markSource('usgs','USGS — gempa M4.5+ global','SIMULATED','https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson');
  // jalankan fetch paralel; masing-masing menandai status sendiri
  fetchJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json',{cacheKey:'swpc_kp'})
    .then(r=>{ markSource('swpc','NOAA SWPC — Kp Index',r.ok?(r.live?'LIVE':'CACHED'):'SIMULATED','https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json'); STATE.kpLive=r.ok?r.data:null; });
  fetchJSON('https://api.nasa.gov/neo/rest/v1/feed?start_date='+new Date().toISOString().slice(0,10)+'&api_key='+(SET.nasaKey||'DEMO_KEY'),{cacheKey:'neo_feed'})
    .then(r=>{ markSource('nasaNeo','NASA NeoWs',r.ok?(r.live?'LIVE':'CACHED'):'SIMULATED','https://api.nasa.gov/neo/rest/v1/feed'); STATE.neoLive=r.ok?r.data:null; });
  fetchJSON('https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=8',{cacheKey:'ll2_up'})
    .then(r=>{ markSource('ll2','Launch Library 2',r.ok?(r.live?'LIVE':'CACHED'):'SIMULATED','https://ll.thespacedevs.com/2.2.0/launch/upcoming/'); STATE.ll2=r.ok?r.data:null; });
  fetchJSON('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json',{cacheKey:'celes_stations',timeout:15000})
    .then(async r=>{
      // CelesTrak sering memblokir/lambat dari jaringan datacenter → coba nasa-proxy bila aktif
      if(!r.ok){ const pu=supaProxyURL('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json'); if(pu) r=await fetchJSON(pu,{cacheKey:'celes_stationsp',timeout:15000}); }
      markSource('celesTrak','CelesTrak GP (TLE)',r.ok?(r.live?'LIVE':'CACHED'):'SIMULATED','https://celestrak.org/NORAD/elements/gp.php'); if(r.ok){ STATE.celestrak=r.data; if(applyTLE(r.data)) logAct('sgp4','TLE CelesTrak termuat — propagasi SGP4 aktif'); } });
  fetchISSNow();
  fetchHorizons(); fetchProbes(); fetchExoLive(); fetchSpaceWeather(); fetchEarthEvents(); refreshSFN(); // engine realtime (04b)
}

function openSizeCompare(){
  const bodies=PLANETS.filter(p=>p.r>0&&p.id!=='sun'&&p.id!=='comet');
  const maxD=Math.max(...bodies.map(b=>typeof b.dKm==='number'?b.dKm:0));
  openModal({title:'Perbandingan Ukuran Planet (skala relatif nyata)',icon:'git-compare',wide:true,body:`
    <canvas id="cmpCanvas" style="width:100%;height:340px;background:rgba(3,7,18,.5);border-radius:12px"></canvas>
    <div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Objek</th><th>Diameter (km)</th><th>Relatif Bumi</th></tr></thead><tbody>
    ${bodies.map(b=>`<tr><td><span style="color:${b.color}">●</span> ${esc(b.name)}</td><td class="mono">${fmtN(b.dKm)}</td><td class="mono">×${(b.dKm/12742).toFixed(2)}</td></tr>`).join('')}
    <tr><td><span style="color:#FFB020">●</span> Matahari</td><td class="mono">${fmtN(1392700)}</td><td class="mono">×109,2</td></tr></tbody></table></div>
    <div class="note">Perbandingan menggunakan diameter nyata (skala relatif benar). Pada visualisasi 3D, ukuran & jarak dikompresi logaritmik.</div>`,
    bind(el){
      const cv=el.querySelector('#cmpCanvas'),ctx=cv.getContext('2d');
      const W=cv.width=cv.clientWidth*1.6,H=cv.height=340*1.6; ctx.scale(1,1);
      ctx.fillStyle='rgba(3,7,18,.01)'; ctx.fillRect(0,0,W,H);
      let x=40;
      bodies.forEach(b=>{
        const r=Math.max(6,Math.sqrt(b.dKm)*.85*(320/Math.sqrt(maxD)));
        const y=H-40;
        const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
        g.addColorStop(0,b.color); g.addColorStop(1,b.color2||b.color);
        ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fillStyle=g; ctx.fill();
        ctx.fillStyle='#94A3B8'; ctx.font='22px Inter'; ctx.textAlign='center';
        ctx.fillText(b.name,x,y+r+26);
        x+=r*2+34;
        if(x>W-40) return;
      });
    }});
}

let SAT_FILTER={q:'',country:'all',orbit:'all',status:'all',page:1,per:8};
function ownerCountry(o){
  if(/Internasional|Multinational|Eropa|Luxembourg|Prancis/.test(o)) return 'Eropa/Intl';
  if(/USA|US |AS \(|SpaceX|Iridium|Intelsat|NASA|NOAA|USGS/.test(o)) return 'USA';
  if(/Tiongkok|CNSA/.test(o)) return 'Tiongkok';
  if(/Rusia|Roscosmos/.test(o)) return 'Rusia';
  if(/India|ISRO/.test(o)) return 'India';
  if(/Jepang|JAXA|JMA/.test(o)) return 'Jepang';
  if(/Indonesia|PSN/.test(o)) return 'Indonesia';
  return 'Lainnya';
}
function favKey(s){ return 'sat_'+(s.norad||s.name); }
function isFav(s){ return !!COLL.favorites[favKey(s)]; }
function toggleFav(s){
  const k=favKey(s);
  const adding=!COLL.favorites[k];
  if(COLL.favorites[k]) delete COLL.favorites[k]; else COLL.favorites[k]={name:s.name,t:Date.now()};
  persist('favorites'); logAct('fav',s.name+(adding?' → ditambahkan ke favorit':' → dihapus dari favorit'));
}
/* Catatan sumber ground track — dinamis mengikuti ketersediaan TLE SGP4 / posisi ISS live */
function satNoteTxt(){
  if(SGP4C.tle&&window.satellite) return 'Posisi ISS/Tiangong & ground track dihitung dengan <b>SGP4 nyata</b> (satellite.js) dari TLE resmi CelesTrak — '+ (SGP4C.tle.n||0) +' objek stations. Kalkulasi orbital ilmiah, bukan simulasi.';
  if(STATE.issNow) return 'Posisi ISS pada peta adalah <b>posisi nyata</b> dari API WhereTheISS.at (LIVE). Track satelit lain memakai model orbit sirkular demo (SIMULATED).';
  return 'Lintasan dihitung dari model orbit sirkular demo (SIMULATED). Saat CelesTrak terjangkau, posisi ISS/Tiangong direpropagasi <b>SGP4 nyata</b> dari TLE resmi NORAD — tekan Refresh.';
}
REG({

      ${kpiCard({icon:'star',label:'Favorit Anda',val:Object.keys(COLL.favorites).filter(k=>k.startsWith('sat_')).length,status:'SAVED',stCls:'st-cos',dir:'flat',delta:'lokal'})}
    </div>
    <div class="panel mb">
      <div class="panel-h"><h3><i data-lucide="search"></i> Katalog Satelit</h3><div class="spacer"></div></div>
      <div class="panel-b">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <input id="satQ" placeholder="Cari nama / NORAD ID…" style="flex:1;min-width:180px;background:rgba(3,7,18,.5);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:9px 13px;font-size:.8rem;outline:none">
          <select id="satCountry" class="btn" style="padding:9px 12px"><option value="all">Semua negara</option>${['USA','Eropa/Intl','Tiongkok','Rusia','India','Jepang','Indonesia','Lainnya'].map(c=>`<option>${c}</option>`).join('')}</select>
          <select id="satStatus" class="btn" style="padding:9px 12px"><option value="all">Semua status</option><option>Operational</option><option>Debris</option><option>Decommissioned</option></select>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px" id="satOrbitChips">
          ${['all','LEO','MEO','GEO','HEO','SSO','Polar','L1','L2'].map(o=>`<button class="chip ${SAT_FILTER.orbit===o?'active':''}" data-orbit="${o}">${o==='all'?'Semua orbit':o}</button>`).join('')}
        </div>
        <div id="satTable"></div>
      </div>
    </div>
    <div class="grid g2 mb">
      <div class="panel"><div class="panel-h"><h3><i data-lucide="route"></i> Ground Track — peta dunia (proyeksi equirectangular)</h3></div>
        <div class="panel-b"><canvas id="satMap" style="width:100%;height:320px;border-radius:10px;background:rgba(3,7,18,.5);cursor:crosshair"></canvas>
        <div class="note blue" id="satNote">${satNoteTxt()}</div></div></div>
      <div class="panel"><div class="panel-h"><h3><i data-lucide="pie-chart"></i> Distribusi Kategori & Orbit</h3></div>
        <div class="panel-b"><div class="chartbox sm"><canvas id="satCats"></canvas></div>
        <div class="chartbox sm mt"><canvas id="satOrbits"></canvas></div></div></div>
    </div>
    <div class="panel"><div class="panel-h"><h3><i data-lucide="star"></i> Daftar Favorit</h3><div class="spacer"></div><span class="badge b-gray">tersimpan lokal</span></div>
      <div class="panel-b" id="satFavs"></div></div>`;
    const drawTable=()=>{
      let list=SATS.filter(s=>
        (SAT_FILTER.q===''||s.name.toLowerCase().includes(SAT_FILTER.q)||String(s.norad).includes(SAT_FILTER.q)) &&

      const total=list.length, pages=Math.max(1,Math.ceil(total/SAT_FILTER.per));

      $('#satTable').innerHTML= total? `<div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th></th><th>Nama</th><th>NORAD</th><th>Pemilik</th><th>Kategori</th><th>Orbit</th><th>Alt (km)</th><th>Periode (mnt)</th><th>Status</th></tr></thead><tbody>
        ${list.map(s=>`<tr data-n="${esc(s.name)}"><td><button class="btn icon sm" data-fav="${esc(s.name)}"><i data-lucide="star" style="color:${isFav(s)?'#FFB020':'var(--dim)'}"></i></button></td>
        <td><b>${esc(s.name)}</b></td><td class="mono">${esc(String(s.norad))}</td><td>${esc(s.owner)}</td><td>${esc(s.cat)}</td>
        <td><span class="badge b-cache">${esc(s.orbit)}</span></td><td class="mono">${esc(String(s.alt))}</td><td class="mono">${esc(String(s.period))}</td>
        <td><span class="dot ${s.status==='Operational'?'d-ok':s.status==='Debris'?'d-bad':'d-dim'}"></span> ${esc(s.status)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="pager"><span>${(SAT_FILTER.page-1)*SAT_FILTER.per+1}–${Math.min(SAT_FILTER.page*SAT_FILTER.per,total)} dari ${total}</span>
        <button class="btn sm" data-pp="prev">‹</button><span>${SAT_FILTER.page}/${pages}</span><button class="btn sm" data-pp="next">›</button></div>`
        : '<div class="empty">Tidak ada satelit yang cocok dengan filter.</div>';
      $$('#satTable [data-fav]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const s=SATS.find(x=>x.name===b.dataset.fav); toggleFav(s); drawTable(); drawFavs(); refreshIcons($('#satTable')); });
      $$('#satTable tr[data-n]').forEach(tr=>tr.onclick=()=>{ if(!tr.dataset.fav) openSatDetail(SATS.find(x=>x.name===tr.dataset.n)); });
      $$('#satTable [data-pp]').forEach(b=>b.onclick=()=>{ SAT_FILTER.page+=b.dataset.pp==='next'?1:-1; drawTable(); });

      const sats=SATS.filter(s=>typeof s.period==='number'&&s.status==='Operational').slice(0,9);
      const cols=['#00D4FF','#8B5CF6','#00E676','#FFB020','#FF3B5C','#67e8f9','#f472b6','#a3e635','#fb923c'];
      sats.forEach((s,i)=>{
        const per=(s.period||100)*60; ctx.strokeStyle=cols[i%9]; ctx.lineWidth=1.3; ctx.beginPath();
        let prev=null;
        for(let t=0;t<=per*2;t+=120){
          const g=groundFor(s,Date.now()+t*1000);
          const p=projectMap(g.lon,g.lat,W,H);

function openSatDetail(s){
  if(!s) return;
  openModal({title:s.name,icon:'satellite',wide:true,body:`

    footer:`<button class="btn" data-fav2>${isFav(s)?'★ Hapus favorit':'☆ Tambah favorit'}</button><button class="btn primary" data-x2>Tutup</button>`,
    bind(el,close){

      const cv=el.querySelector('#satTrack'),W=cv.clientWidth*1.5,H=260*1.5;

      const per=(typeof s.period==='number'?s.period:100)*60;
      ctx.strokeStyle='#00D4FF';ctx.lineWidth=1.4;ctx.beginPath();let prev=null;
      for(let t=0;t<=per*2;t+=120){
        const g=groundFor(s,Date.now()+t*1000); const p=projectMap(g.lon,g.lat,W,H);
        if(prev&&Math.abs(p.x-prev.x)>W/2) ctx.moveTo(p.x,p.y); else prev?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
        prev=p;
      }
      ctx.stroke();
      const g0=groundFor(s,Date.now());const p0=projectMap(g0.lon,g0.lat,W,H);
      ctx.fillStyle='#00E676';ctx.beginPath();ctx.arc(p0.x,p0.y,5,0,6.283);ctx.fill();
      ctx.fillStyle='#F8FAFC';ctx.font='11px Inter';ctx.textAlign='left';
      ctx.fillText('Posisi saat ini: '+g0.lat.toFixed(1)+'°, '+g0.lon.toFixed(1)+'°, '+g0.alt+' km ('+(g0.src||'model demo')+')',10,16);
    }});
}

function openNeoDetail(n){

    footer:`<button class="btn" data-simulasi>Simulasi Pendekatan</button><button class="btn primary" data-x2>Tutup</button>`,
    bind(el,close){
      el.querySelector('[data-x2]').onclick=close;
      const cv=el.querySelector('#neoApp'),W=cv.clientWidth*1.5,H=240*1.5;cv.width=W;cv.height=H;
      const ctx=cv.getContext('2d');
      const cx=W/2,cy=H/2;
      const E=Math.min(W,H)*.16;
      const g=ctx.createRadialGradient(cx-E*.3,cy-E*.3,E*.1,cx,cy,E);
      g.addColorStop(0,'#2f8fd8');g.addColorStop(1,'#1d5c9e');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,E,0,6.283);ctx.fill();
      ctx.fillStyle='#94A3B8';ctx.font='14px Inter';ctx.fillText('Bumi',cx+E*1.1,cy);

      ctx.beginPath();ctx.moveTo(cx-E,cy);ctx.lineTo(cx-E,cy-missPx-E);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#ff3b5c';
      const nx=cx+missPx+E*1.4,ny=cy-missPx*.4;
      ctx.beginPath();ctx.arc(nx,ny,Math.max(4,neoDiam(n)*4),0,6.283);ctx.fill();
      ctx.fillStyle='#F8FAFC';ctx.font='13px Inter';ctx.fillText(n.name,nx-20,ny-14);
      ctx.strokeStyle='rgba(255,59,92,.5)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(nx,ny,E*1.2+missPx*.4,0,6.283);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#64748B';ctx.font='12px Inter';ctx.textAlign='center';
      ctx.fillText('Skema pendekatan — tidak berskala · miss ' + n.miss + ' jt km',W/2,H-10);
      el.querySelector('[data-simulasi]').onclick=()=>{
        let t=0;
        const iv=setInterval(()=>{
          t+=.02;
          const ctx2=cv.getContext('2d');

function kpColor(kp){ return kp<2?'#00e676':kp<4?'#00d4ff':kp<5?'#ffb020':kp<6?'#f97316':'#ff3b5c'; }
function kc2status(cls){ return cls[0]==='X'?'EXTREME':cls[0]==='M'?'MODERATE':cls[0]==='C'?'MINOR':'NORMAL'; }
function drawKpGauge(id,kp){
  const cv=document.getElementById(id); if(!cv) return;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const cx=170,cy=150,R=120;
  for(let i=0;i<=9;i++){
    const a=Math.PI*(1-i/9);
    ctx.beginPath();ctx.arc(cx,cy,R,a-Math.PI/9,a);
    ctx.lineWidth=14;ctx.strokeStyle=kpColor(i);
    ctx.globalAlpha=i<=kp?1:.14;ctx.stroke();ctx.globalAlpha=1;
  }
  const a=Math.PI*(1-clamp(kp,0,9)/9);
  ctx.fillStyle='#F8FAFC';ctx.font='800 40px Orbitron, monospace';ctx.textAlign='center';
  ctx.fillText(kp.toFixed(1),cx,cy-6);
  ctx.font='600 13px Inter';ctx.fillStyle='#94A3B8';
  ctx.fillText('0',cx-R-4,cy+14);ctx.fillText('9',cx+R+4,cy+14);
}
function drawMagnetosphere(id,kp){
  const cv=document.getElementById(id); if(!cv) return;
  const ctx=cv.getContext('2d');
  let t=0;
  const draw=()=>{
    const W=cv.clientWidth,H=cv.clientHeight||240;
    if(cv.width!==W*1.4){cv.width=W*1.4;cv.height=H*1.4;}
    ctx.setTransform(1.4,0,0,1.4,0,0);
    ctx.clearRect(0,0,W,H);
    const cx=W*.72,cy=H*.52,R=Math.min(H*.32,42);
    // matahari & angin
    ctx.fillStyle='#FFB020';ctx.beginPath();ctx.arc(14,H*.52,10,0,6.283);ctx.fill();
    ctx.fillStyle='#64748B';ctx.font='10px Inter';ctx.fillText('SUN',8,H*.52+22);
    for(let i=0;i<5;i++){
      ctx.strokeStyle='rgba(255,176,32,.25)';ctx.beginPath();
      const x=((t*30+i*90)%W);
      ctx.moveTo(x,H*.52-1);ctx.lineTo(x-24,H*.52);ctx.moveTo(x,H*.52+1);ctx.lineTo(x-24,H*.52);ctx.stroke();
    }
    // medan magnet
    for(let i=1;i<=5;i++){
      const sq=1- i*.12;
      ctx.strokeStyle=`rgba(0,212,255,${.5-i*.07})`;ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.ellipse(cx+(5-i)*7,cy,R*sq*1.15,R*sq,-Math.PI/2,Math.PI/2,true);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx,cy-R*sq);ctx.quadraticCurveTo(W*.25,cy-R*sq*2.2,6,cy-R*sq*2.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx,cy+R*sq);ctx.quadraticCurveTo(W*.25,cy+R*sq*2.2,6,cy+R*sq*2.6);
      ctx.stroke();
    }
    // bumi
    const g=ctx.createRadialGradient(cx-R*.3,cy-R*.3,2,cx,cy,R);
    g.addColorStop(0,'#2f8fd8');g.addColorStop(1,'#123');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,6.283);ctx.fill();
    // partikel → kutub
    for(let i=0;i<12;i++){
      const p=(t*.6+i*.09)%1;
      const y=cy+(p<.5?-1:1)*(R+p*R*2.4);
      const x=cx+Math.cos(p*3.14)*R*1.6*(p<.5?1:-1);
      ctx.fillStyle=`rgba(0,230,118,${.9-p*.6})`;
      ctx.beginPath();ctx.arc(cx+x*.5,y,2,0,6.283);ctx.fill();
    }
    t+=.02;
    if(SET.anim&&STATE.page==='weather') requestAnimationFrame(draw);
    else{ ctx.fillStyle='#64748B';ctx.font='10px Inter';ctx.fillText('(animasi dihentikan — refresh halaman untuk memutar ulang)',10,H-10); }
  };
  draw();
}

function deepThumb(cv,obj){
  const ctx=cv.getContext('2d');

    const arm=3;
    ctx.translate(W/2,H/2);
    ctx.rotate(R()*6.28);

      ctx.beginPath();
      for(let i=0;i<40;i++){ const th=i/40*4.2, r=i/40*W*.42; ctx.lineTo(Math.cos(th+a*2.09)*r,Math.sin(th+a*2.09)*r*.55); }
      ctx.strokeStyle=`rgba(139,92,246,${.35-R()*.15})`;ctx.lineWidth=6;ctx.stroke();
    }
    const g=ctx.createRadialGradient(0,0,2,0,0,W*.14);
    g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,214,120,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,W*.14,0,6.283);ctx.fill();
    ctx.setTransform(1,0,0,1,0,0);

      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,['rgba(255,120,80,.5)','rgba(80,140,255,.45)','rgba(180,80,255,.4)','rgba(80,255,200,.35)'][i%4]);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }

  } else if(cat==='Star Cluster'){
    for(let i=0;i<160;i++){ const x=W/2+(R()-.5)*W*.7,y=H/2+(R()-.5)*H*.7; ctx.fillStyle=`rgba(255,${230+R()*25},${200+R()*55},${.4+R()*.6})`;ctx.beginPath();ctx.arc(x,y,.8+R()*1.8,0,6.283);ctx.fill(); }
  } else {
    ctx.fillStyle='rgba(255,180,60,.9)';ctx.beginPath();ctx.arc(W/2,H/2,W*.06,0,6.283);ctx.fill();

    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
}
function mulberry(seed){ let s=seed; return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

        ${[['Natural Signal','var(--ok)','Proses astrofisika: maser, pulsar, FRB'],['Human-Made Signal','var(--neon)','Satelit, radar, downlink wahana'],['Radio Interference','var(--warn)','RFI terestrial/industri — di rule-out'],['Unclassified Signal','var(--dim)','Menunggu pengamatan ulang'],['Candidate for Further Investigation','var(--cosmic)','Prioritas tindak lanjut — TIDAK diklaim ETI']]
        .map(c=>`<div class="list-row"><span class="dot" style="background:${c[1]}"></span><div class="body"><b>${c[0]}</b><p>${c[1]==='' ? '':c[2]}</p></div></div>`).join('')}
        <div class="note">Contoh historis (HISTORICAL): Wow! Signal 1977 (unclassified), BLC1 2019 (kemungkinan RFI), FRB 121102 (natural).</div>
      </div>
    </div>`;
    const spec=()=>Array.from({length:48},(_,i)=>{ let v=rand(.08,.22); SETI_STATE.rows.forEach(r=>{const w=Math.exp(-Math.pow((i-r.bin)/1.6,2)); v+=r.amp*w*(1-Math.abs(r.age-r.life)/r.life*.3);}); return Math.min(1,v); });
    const initWaterfall=()=>{
      const cv=$('#setiWaterfall');
      const fit=()=>{ const w=cv.clientWidth,h=cv.clientHeight; if(w&&cv.width!==w*1.2){cv.width=w*1.2;cv.height=h*1.2;} };
      fit();
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#01040a';ctx.fillRect(0,0,cv.width,cv.height);
      const step=()=>{
        if(!document.getElementById('setiWaterfall')){SETI_STATE.raf=null;return;}
        fit();
        const W=cv.width,H=cv.height;
        // shift down
        ctx.drawImage(cv,0,0,W,H-2,0,2,W,H-2);
        ctx.fillStyle='#01040a';ctx.fillRect(0,0,W,2);
        const s=spec();
        for(let i=0;i<48;i++){
          const v=s[i];
          ctx.fillStyle=`rgba(${Math.round(10+v*200)},${Math.round(80+v*120)},${Math.round(160+v*40)},${.35+v*.65})`;
          ctx.fillRect(i/48*W,0,W/48+1,2);
        }
        $('#setiSnr').textContent=(rand(4,26)).toFixed(1)+' dB';
        SETI_STATE.raf=requestAnimationFrame(step);
      };
      step();
    };
    initWaterfall();
    // spectrum chart
    let spectrumChart=null,powerChart=null;
    const updSpectrum=()=>{
      const s=spec().map(v=>+(v*100).toFixed(1));
      if(!spectrumChart) spectrumChart=mkChart('setiSpectrum',{type:'bar',data:{labels:s.map((_,i)=>(SETI_STATE.freq-1+i/24).toFixed(2)),datasets:[{data:s,backgroundColor:'rgba(0,212,255,.55)',borderRadius:2}]},options:{plugins:{legend:{display:false}},scales:{y:{max:100,min:0},x:{ticks:{maxTicksLimit:8,font:{size:8}}}}}});
      else{ spectrumChart.data.datasets[0].data=s; spectrumChart.update('none'); }
      if(!powerChart) powerChart=mkChart('setiPower',{type:'line',data:{labels:[],datasets:[{data:[],borderColor:'#00E676',fill:true,backgroundColor:'rgba(0,230,118,.1)',pointRadius:0,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{min:0,max:100}}}});
      else{ const d=powerChart.data.datasets[0].data; d.push(Math.max(...s)); if(d.length>40)d.shift(); powerChart.update('none'); }
    };
    const specTimer=setInterval(()=>{ if(document.getElementById('setiSpectrum')) updSpectrum(); else clearInterval(specTimer); },900);
    updSpectrum();
    const drawTable=()=>{
      const f=$('#setiClassF').value;
      const list=(COLL.signals&&COLL.signals.length?COLL.signals:SIGNALS_SEED).filter(s=>f==='all'||s.cls===f);
      $('#setiTable').innerHTML=list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sinyal</th><th>Freq (MHz)</th><th>SNR</th><th>Durasi (s)</th><th>Teleskop</th><th>Klasifikasi</th><th>Status</th></tr></thead><tbody>
      ${list.map(s=>`<tr data-n="${esc(s.name)}" style="cursor:pointer"><td><b>${esc(s.name)}</b></td><td class="mono">${s.freq}</td><td class="mono">${s.snr}</td><td class="mono">${s.dur}</td><td>${esc(s.tel)}</td>
      <td><span class="badge ${s.cls.includes('Candidate')?'b-cos':s.cls==='Radio Interference'?'b-sim':s.cls==='Natural Signal'?'b-live':'b-gray'}" style="${s.cls.includes('Candidate')?'background:rgba(139,92,246,.13);color:#b39dff;border:1px solid rgba(139,92,246,.35)':''}">${esc(s.cls)}</span></td><td>${esc(s.status)}</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty">Belum ada kandidat terkatalog.</div>';
      $$('#setiTable tr[data-n]').forEach(tr=>tr.onclick=()=>openSignalDetail(list.find(x=>x.name===tr.dataset.n)));
    };
    drawTable();
    $('#setiClassF').onchange=drawTable;
    const addObservation=(msg)=>{ COLL.obsHistory=(COLL.obsHistory||[]); };
    $('#setiToggle').onclick=e=>{
      SETI_STATE.running=!SETI_STATE.running;
      e.currentTarget.innerHTML=SETI_STATE.running?'<i data-lucide="square"></i> Hentikan':'<i data-lucide="play"></i> Mulai Scanner';
      refreshIcons(view);
      if(SETI_STATE.running){
        toast('Scanner aktif','Memindai pita radio (simulasi). Kandidat akan dicatat otomatis.','info');
        SETI_STATE.scanTimer=setInterval(()=>{
          if(Math.random()<.14){
            const bin=randInt(2,46), freq=(SETI_STATE.freq-1+bin/24);
            const drift=rand(-.4,.4);
            SETI_STATE.rows.push({bin,amp:rand(.5,.95),life:randInt(8,30),age:0,drift});
            const isRFI=[1420,1215,2400].some(f=>Math.abs(freq-f)<.15)&&Math.random()<.7;
            const cls=isRFI?'Radio Interference':Math.random()<.25?'Candidate for Further Investigation':Math.random()<.5?'Natural Signal':'Unclassified Signal';
            const sig={id:uid(),name:'CAND-'+randInt(1000,9999)+' (simulasi)',freq:+freq.toFixed(3),snr:+rand(4,30).toFixed(1),dur:randInt(30,600),tel:pick(['FAST (simulasi)','Parkes (simulasi)','MeerKAT (simulasi)','ATA (simulasi)']),cls,status:'Menunggu verifikasi',note:'Hasil scanner demo: '+(isRFI?'pola persisten sempit → dicurigai RFI.':'transien dengan drift; perlu rule-out RFI & pengamatan ulang.'),sim:true};
            COLL.signals=COLL.signals||[];
            COLL.signals.unshift(sig); persist('signals');
            $('#setiRfi').textContent=+$('#setiRfi').textContent+ (cls==='Radio Interference'?1:0);
            logAct('seti','Kandidat baru: '+sig.name+' → '+cls);
            if(SET.notify) toast('Sinyal terdeteksi',sig.name+' — '+cls,'warn');
            drawTable();
          }
          SETI_STATE.rows.forEach(r=>{r.age++;r.bin+=r.drift*.3;});
          SETI_STATE.rows=SETI_STATE.rows.filter(r=>r.age<r.life+30);
        },1200);
      } else {
        clearInterval(SETI_STATE.scanTimer);
        toast('Scanner dihentikan','Sesi pemantauan dicatat ke riwayat.','ok');
      }
    };
    $('#setiInject').onclick=()=>{
      SETI_STATE.rows.push({bin:randInt(10,38),amp:1,life:40,age:0,drift:rand(-.3,.3)});
      toast('Sinyal uji disuntikkan','Simulasi transien ditambahkan ke waterfall.','info');
    };
    $('#setiClear').onclick=async()=>{
      if(await confirmDialog('Reset database sinyal','Semua kandidat tersimpan (termasuk hasil scanner) akan dihapus dan digantikan dataset awal. Lanjutkan?')){
        COLL.signals=null; persist('signals'); drawTable(); toast('Reset selesai','Database kandidat dikembalikan ke set awal.','ok');
      }
    };
    $('#setiObs').innerHTML=(COLL.log||[]).filter(l=>l.type==='seti').slice(0,10).map(l=>`
      <div class="list-row"><i data-lucide="clipboard-list" style="color:var(--dim)"></i><div class="body"><b>${esc(l.msg)}</b><div class="meta"><span>${timeAgo(l.t)}</span></div></div></div>`).join('')
      ||'<div class="empty">Belum ada riwayat observasi. Jalankan scanner.</div>';
    refreshIcons(view);
  }
});

function riskScore(r){ return Math.round(r.prob*r.imp/100); }
function riskLevel(sc){ return sc<15?'LOW':sc<30?'MODERATE':sc<45?'ELEVATED':sc<65?'HIGH':'CRITICAL'; }
function riskCls(l){ return {LOW:'rlv-low',MODERATE:'rlv-mod',ELEVATED:'rlv-ele',HIGH:'rlv-high',CRITICAL:'rlv-crit'}[l]; }
REG({
  id:'threat',icon:'shield-alert',sec:'intel',
  name:{id:'Cosmic Threat Assessment',en:'Cosmic Threat Assessment'},
  sub:{id:'Analisis risiko fenomena kosmik: matriks, probabilitas × dampak, tingkat kepercayaan & aksi monitoring. Skor = simulasi edukatif.',en:'Cosmic risk analysis: matrix, probability × impact, confidence & monitoring actions. Scores are educational simulation.'},
  render(view){
    const scored=RISKS.map(r=>Object.assign({},r,{sc:riskScore(r),lv:riskLevel(riskScore(r))})).sort((a,b)=>b.sc-a.sc);
    view.innerHTML=`
    <div class="page-head">
      <div><h1><i data-lucide="shield-alert"></i> ${esc(L(this.name))}</h1><p>${esc(L(this.sub))}</p></div>
      <div class="page-actions"><span class="badge b-sim">SKOR = SIMULASI</span><span class="badge b-live">BASE = DATA RESMI</span></div>
    </div>
    <div class="note red mb" style="max-width:none"><b>Pemisahan data:</b> kolom "Klasifikasi dasar" mengikuti tingkat umum yang didukung publikasi resmi (NASA CNEOS, NOAA, ESA). Kolom "Risk Score" dihitung sistem (probabilitas × dampak / 100) dan HANYA untuk latihan analisis — tidak digunakan untuk keputusan operasional.</div>
    <div class="panel mb">
      <div class="panel-h"><h3><i data-lucide="table"></i> Risk Assessment — ${RISKS.length} Kategori</h3></div>
      <div class="panel-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategori</th><th>Probability</th><th>Impact</th><th>Confidence</th><th>Risk Score</th><th>Level (hitung)</th><th>Base (resmi)</th><th>Monitoring Priority</th></tr></thead><tbody>
      ${scored.map(r=>`<tr><td><b>${esc(r.cat)}</b></td><td class="mono">${r.prob}%</td><td class="mono">${r.imp}</td><td>${esc(r.conf)}</td><td class="mono">${r.sc}</td>
      <td><span class="risk-lv ${riskCls(r.lv)}">${r.lv}</span></td><td><span class="risk-lv ${riskCls(r.base)}">${r.base}</span></td><td>${esc(r.prio)}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
    <div class="grid g2 mb">
      <div class="panel"><div class="panel-h"><h3><i data-lucide="grid-3x3"></i> Risk Matrix — posisi kategori</h3></div>
        <div class="panel-b"><canvas id="thMatrix" style="width:100%;height:340px"></canvas>
        <div class="legend mt"><i style="background:#00e676"></i>LOW <i style="background:#00d4ff"></i>MODERATE <i style="background:#ffb020"></i>ELEVATED <i style="background:#f97316"></i>HIGH <i style="background:#ff3b5c"></i>CRITICAL</div></div></div>
      <div class="panel"><div class="panel-h"><h3><i data-lucide="bar-chart-3"></i> Risk Score Ranking (simulasi)</h3></div>
        <div class="panel-b"><div class="chartbox lg"><canvas id="thRank"></canvas></div></div></div>
    </div>
    <div class="panel mb"><div class="panel-h"><h3><i data-lucide="history"></i> Historical Risk Data — peristiwa & arsip (HISTORICAL)</h3></div>
      <div class="panel-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategori</th><th>Rekam historis utama</th></tr></thead><tbody>
      ${RISKS.map(r=>`<tr><td><b>${esc(r.cat)}</b></td><td style="white-space:normal;max-width:520px">${esc(r.hist)}</td></tr>`).join('')}</tbody></table></div>
      <div class="chartbox mt"><canvas id="thHist"></canvas></div></div></div>
    <div class="disclaimer"><i data-lucide="shield-question"></i><span>Tidak ada ancaman tumbukan besar terverifikasi saat ini. Probabilitas asteroid hanya dikutip dari publikasi resmi (mis. Bennu 0,057% pada 2175–2196). Angka lain = model edukatif SIS.</span></div>`;
    const cv=$('#thMatrix'),W=cv.clientWidth*1.5,H=340*1.5;cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d');
    const px=x=>W*.14+x/5*(W*.82),py=y=>H*.88-y/5*(H*.8);
    for(let i=1;i<=5;i++){
      for(let j=1;j<=5;j++){
        const sc=i*j;
        ctx.fillStyle=(sc<=4?'rgba(0,230,118,.16)':sc<=8?'rgba(0,212,255,.16)':sc<=14?'rgba(255,176,32,.18)':sc<=20?'rgba(249,115,22,.2)':'rgba(255,59,92,.22)');
        ctx.fillRect(px(j-1)+1,py(i)-1,(W*.82)/5-2,-(H*.8)/5+2);
      }
    }
    ctx.fillStyle='#94A3B8';ctx.font='15px Inter';
    ctx.fillText('Impact →',W*.4,H*.96);ctx.save();ctx.translate(W*.04,H*.5);ctx.rotate(-Math.PI/2);ctx.fillText('Probability →',-30,0);ctx.restore();
    scored.forEach(r=>{
      const i=Math.ceil(r.prob/20),j=Math.ceil(r.imp/20);
      const x=px(j-.5),y=py(i-.5);
      ctx.fillStyle='#F8FAFC';ctx.font='700 15px Inter';ctx.textAlign='center';
      ctx.fillText(r.cat.split(' ')[0],x,y);
      ctx.strokeStyle='rgba(248,250,252,.5)';ctx.beginPath();ctx.arc(x,y,12,0,6.283);ctx.stroke();
    });
    mkChart('thRank',{type:'bar',data:{labels:scored.map(r=>r.cat),datasets:[{label:'Score',data:scored.map(r=>r.sc),backgroundColor:scored.map(r=>({LOW:'#00e676',MODERATE:'#00d4ff',ELEVATED:'#ffb020',HIGH:'#f97316',CRITICAL:'#ff3b5c'}[r.lv])),borderRadius:5}]},
      options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100}}}});
    mkChart('thHist',{type:'line',data:{labels:['1970','1980','1990','2000','2010','2015','2020','2026'],
      datasets:[{label:'Event debris/fragmentasi tercatat (kumulatif, ~)',data:[300,800,1500,3200,5000,5900,6500,6500],borderColor:'#FFB020',tension:.3,pointRadius:2},
      {label:'Storm geomagnetik kuat per dekade',data:[6,7,5,6,4,5,5,5],borderColor:'#00D4FF',tension:.3,pointRadius:2}]},
      options:{scales:{y:{beginAtZero:true}}}});
    refreshIcons(view);
  }
});

let debrisCloud=[];
function genDebris(n){
  if(debrisCloud.length>=n) return debrisCloud;
  while(debrisCloud.length<n){
    const i=debrisCloud.length;
    debrisCloud.push({name:'DEB-'+String(10000+i*37).padStart(5,'0'),norad:30000+i*7,owner:'Debris (simulasi)',cat:'Space Debris',launch:'20'+randInt(5,22)+'-01-01',

  }
  return debrisCloud;
}

      const km=d*LY_KM, yr=d/s;
      $('#lyOut').innerHTML=`<div class="tiles">
        <div class="tile"><small>Jarak dalam km</small><b>${km.toExponential(4)} km</b></div>
        <div class="tile"><small>Waktu tempuh</small><b>${yr>=1?fmtN(yr,1)+' tahun':fmtN(yr*365.25*24,1)+' jam'}</b></div>
        <div class="tile"><small>Kecepatan wahana</small><b>${fmtN(s*299792.458,0)} km/s</b></div>
      </div>
      <div class="note blue">Rumus: t = d/v. c = 299.792,458 km/s; 1 ly = 9,4607×10¹² km. Wahana nyata (±15–70 km/s) membuat tempuh 1 ly memerlukan ribuan tahun — alasan utama eksplorasi antarbintang masih konsep.</div>`;
    };
    $('#evBody').onchange=e=>{ const b=MU_PRESETS[e.target.value]; $('#evM').value=b.M; $('#evR').value=b.R; };
    $('#evGo').onclick=()=>{
      const M=val('evM',v=>v>0), R=val('evR',v=>v>0);
      if(!M||!R){ toast('Validasi gagal','M & R harus > 0.','err'); return; }
      const v=Math.sqrt(2*G_SI*M/(R*1000))/1000;
      $('#evOut').innerHTML=`<div class="tile"><small>Kecepatan lepas</small><b style="font-size:1.3rem;color:var(--neon)">${v.toFixed(2)} km/s</b></div>
      <div class="note blue">Rumus: v = √(2GM/R). G = 6,674×10⁻¹¹ N·m²/kg². Bumi: 11,19 km/s. Setengah energi ini cukup untuk orbit sirkular (√2 lebih kecil). Bandingkan: Bulan 2,38 · Mars 5,03 · Jupiter 59,5 km/s.</div>`;
    };
    $('#opGo').onclick=()=>{
      const b=MU_PRESETS[$('#opBody').value];
      let a=val('opA',v=>v>0); if(!a){ toast('Validasi gagal','a harus > 0.','err'); return; }
      if($('#opUnit').value==='au') a=a*AU_KM;
      const T=2*Math.PI*Math.sqrt(Math.pow(a,3)/b.mu);
      $('#opOut').innerHTML=`<div class="tiles">
        <div class="tile"><small>Periode</small><b>${fmtN(T,0)} s</b></div>
        <div class="tile"><small></small><b>${fmtN(T/86400,2)} hari</b></div>
        <div class="tile"><small></small><b>${fmtN(T/86400/365.25,3)} tahun</b></div>
      </div>
      <div class="note blue">Rumus Kepler III: T = 2π√(a³/μ), μ = GM. a diukur dari pusat badan pusat (radius + ketinggian). Contoh: LEO 400 km di Bumi ≈ 92,3 menit — cocok dengan ISS.</div>`;
    };
    $('#pgGo').onclick=()=>{
      const M=val('pgM',v=>v>0), R=val('pgR',v=>v>0);
      if(!M||!R){ toast('Validasi gagal','M & R harus > 0.','err'); return; }
      const g=G_SI*M/Math.pow(R*1000,2);
      $('#pgOut').innerHTML=`<div class="tiles">
        <div class="tile"><small>Gravitasi permukaan</small><b style="color:var(--neon);font-size:1.2rem">${g.toFixed(2)} m/s²</b></div>
        <div class="tile"><small>Relatif Bumi</small><b>×${(g/9.81).toFixed(3)}</b></div>
      </div>
      <div class="note blue">Rumus: g = GM/R². Ini gravitasi "efektif" untuk objek di permukaan (tanpa rotasi). Bumi 9,81; Mars 3,71; Bulan 1,62 m/s².</div>`;

    const drawHyp=()=>{

      },700+rand(0,600));

      ask($('#astraIn').value); $('#astraIn').value='';
    });

  }
});

const REPORT_TYPES=['Daily Space Intelligence Report','Weekly Space Activity Report','Monthly Space Intelligence Report','Satellite Monitoring Report','Asteroid Monitoring Report','Space Weather Report','Signal Analysis Report','Cosmic Risk Assessment Report','Space Mission Report','Scientific Research Report'];
REG({
  id:'reports',icon:'file-text',sec:'sys',
  name:{id:'Intelligence Reports',en:'Intelligence Reports'},
  sub:{id:'Penyusunan laporan profesional: generate, preview, catatan analisis, cetak/PDF, ekspor CSV/JSON & riwayat.',en:'Professional reporting: generate, preview, analysis notes, print/PDF, CSV/JSON export & history.'},
  render(view){
    view.innerHTML=`
    <div class="page-head">
      <div><h1><i data-lucide="file-text"></i> ${esc(L(this.name))}</h1><p>${esc(L(this.sub))}</p></div>
      <div class="page-actions"><button class="btn" id="repHistBtn"><i data-lucide="history"></i> Riwayat (${(COLL.reports||[]).length})</button></div>
    </div>
    <div class="panel mb"><div class="panel-h"><h3><i data-lucide="wand-2"></i> Generate Report</h3></div>
      <div class="panel-b">
        <div class="form-row">
          <div class="field"><label>Jenis laporan</label><select id="repType">${REPORT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
          <div class="field"><label>Periode</label><select id="repPeriod"><option value="24h">24 jam terakhir</option><option value="7d" selected>7 hari terakhir</option><option value="30d">30 hari terakhir</option><option value="custom">Rentang kustom</option></select></div>
          <div class="field" id="repFromWrap" style="display:none"><label>Dari</label><input id="repFrom" type="date"></div>
          <div class="field" id="repToWrap" style="display:none"><label>Hingga</label><input id="repTo" type="date"></div>
        </div>
        <div class="field"><label>Catatan analisis (opsional — dimasukkan ke laporan)</label><textarea id="repNotes" placeholder="mis. Fokus analisis: korelasi Kp tinggi dengan anomali GNSS…"></textarea></div>
        <button class="btn primary" id="repGen"><i data-lucide="sparkles"></i> Generate & Preview</button>
      </div></div>
    <div class="panel"><div class="panel-h"><h3><i data-lucide="history"></i> Riwayat Laporan Tersimpan</h3></div>
      <div class="panel-b" id="repHist"></div></div>`;
    $('#repPeriod').onchange=e=>{ const c=e.target.value==='custom'; $('#repFromWrap').style.display=c?'':'none'; $('#repToWrap').style.display=c?'':'none'; };
    $('#repHistBtn').onclick=()=>$('#repHist').scrollIntoView({behavior:'smooth'});
    const drawHist=()=>{
      const list=COLL.reports||[];
      $('#repHist').innerHTML=list.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Judul</th><th>Jenis</th><th>Periode</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody>
      ${list.map(r=>`<tr><td><b>${esc(r.title)}</b></td><td>${esc(r.type)}</td><td>${esc(r.periodLabel)}</td><td class="mono">${fmtDate(r.created)}</td>
      <td><button class="btn sm primary" data-open="${r.id}">Buka</button><button class="btn sm" data-csv="${r.id}">CSV</button><button class="btn sm" data-json="${r.id}">JSON</button><button class="btn sm danger" data-del="${r.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty">Belum ada laporan tersimpan. Generate laporan pertama di atas.</div>';
      $$('#repHist [data-open]').forEach(b=>b.onclick=()=>showReport((COLL.reports||[]).find(r=>r.id===b.dataset.open)));
      $$('#repHist [data-csv]').forEach(b=>b.onclick=()=>{ const r=(COLL.reports||[]).find(x=>x.id===b.dataset.csv); exportReportCSV(r); });
      $$('#repHist [data-json]').forEach(b=>b.onclick=()=>{ const r=(COLL.reports||[]).find(x=>x.id===b.dataset.json); download(r.title.replace(/\s+/g,'_')+'.json',JSON.stringify(r,null,2),'application/json'); });
      $$('#repHist [data-del]').forEach(b=>b.onclick=async()=>{ if(await confirmDialog('Hapus laporan','Laporan akan dihapus dari riwayat lokal.')){ COLL.reports=COLL.reports.filter(x=>x.id!==b.dataset.del); persist('reports'); drawHist(); } });
    };
    drawHist();
    $('#repGen').onclick=()=>{
      const type=$('#repType').value, per=$('#repPeriod').value;
      const w=weatherNow(),ks=kpStatus(w.kp);
      const pha=NEOS.filter(n=>n.pha).length;
      const act=(COLL.missions||MISSIONS_SEED).filter(m=>m.status==='Active');
      const cands=(COLL.signals||SIGNALS_SEED).filter(s=>s.cls==='Candidate for Further Investigation');
      const alerts=(COLL.alerts||ALERTS_SEED).filter(a=>!a.read);
      const periodLabel={ '24h':'24 jam terakhir','7d':'7 hari terakhir','30d':'30 hari terakhir','custom':($('#repFrom').value||'—')+' s.d. '+($('#repTo').value||'—') }[per];
      const rep={
        id:'r-'+uid(), type, periodLabel, created:Date.now(),
        title:type.replace(' Report','')+' — SIS Intelligence '+new Date().toISOString().slice(0,10),
        notes:$('#repNotes').value.trim(),
        exec:`Pada periode ${periodLabel}, ${SATS.length} objek satelit/objek buatan terkatalog (SIMULATED) dengan ${SATS.filter(s=>s.status==='Operational').length} berstatus operational; ${act.length} misi berjalan aktif. Cuaca antariksa simulasi menunjukkan Kp ${w.kp} (${ks[0]}) dengan angin matahari ${w.wind} km/s. Tidak ada ancaman tumbukan terverifikasi; ${pha} objek berstatus PHA dipantau rutin. ${cands.length} kandidat sinyal SETI berstatus investigasi lanjutan (semua simulasi).`,
        findings:[
          `Cuaca antariksa (simulasi): Kp ${w.kp} — ${ks[0]}; Bz ${w.bz} nT; sunspot ${w.ss}; flare terakhir ${w.flares[0].cls}.`,
          `Satelit (demo): ${SATS.filter(s=>s.cat==='Earth Observation Satellites').length} satelit observasi Bumi, ${SATS.filter(s=>s.cat==='Communication Satellites').length} komunikasi, ${SATS.filter(s=>s.cat==='Navigation Satellites').length} navigasi, ${SATS.filter(s=>s.status==='Debris').length+2} contoh debris.`,
          `NEO: ${NEOS.length} objek terkatalog dengan ${pha} PHA; pendekatan demo terdekat: ${NEOS.slice().sort((a,b)=>a.miss-b.miss)[0].name} pada ${NEOS.slice().sort((a,b)=>a.miss-b.miss)[0].miss} juta km (jadwal simulasi).`,
          `Misi: ${act.map(m=>m.name).slice(0,4).join(', ')} aktif; progress rata-rata ${Math.round(act.reduce((s,m)=>s+m.progress,0)/act.length)}%.`,
          `Risiko tertinggi (skor simulasi): ${RISKS.map(r=>({r,sc:riskScore(r)})).sort((a,b)=>b.sc-a.sc)[0].r.cat}.`,
          `Alert: ${alerts.length} peringatan belum dibaca; ${alerts.filter(a=>a.sim).length} di antaranya simulasi.`
        ],
        analysis:($('#repNotes').value.trim()||'Analisis otomatis: tren aktivitas matahari simulasi berada pada rentang moderate; konfigurasi konstelasi LEO menunjukkan densitas tertinggi pada pita 500–600 km. Penilaian risiko menggunakan pendekatan probabilitas × dampak untuk latihan, dengan level dasar mengikuti publikasi resmi.')+'\n\nCatatan operator: '+( $('#repNotes').value.trim()? 'disertakan di bawah.':'tidak ada input operator.'),
        conclusion:'Tidak ada kondisi anomali yang memerlukan tindakan operasional berdasarkan dataset demonstrasi. Pemantauan rutin dianjurkan pada kategori Space Debris dan Solar Radiation.',
        recommendations:['Aktifkan sumber LIVE (NOAA SWPC / NeoWs) bila koneksi memungkinkan untuk menggantikan data simulasi.','Lakukan conjunction screening resmi sebelum maneuver wahana (jangan gunakan hasil demo).','Review daftar PHA mingguan melalui CNEOS.','Perbarui catatan analisis operator pada setiap siklus laporan.'],
        sources:[['NOAA SWPC — noaa-planetary-k-index','https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json'],['NASA NeoWs','https://api.nasa.gov/neo/rest/v1/feed'],['CelesTrak GP','https://celestrak.org/NORAD/elements/gp.php'],['Launch Library 2','https://ll.thespacedevs.com/2.2.0/'],['NASA Exoplanet Archive','https://exoplanetarchive.ipac.caltech.edu/'],['CNEOS (SENTRY/Scout)','https://cneos.jpl.nasa.gov/']],
        dataStamp:fmtDate(Date.now()), sim:true
      };
      if(!COLL.reports) COLL.reports=[];
      COLL.reports.unshift(rep); persist('reports');
      drawHist(); showReport(rep); logAct('report','Laporan dibuat: '+rep.title);
    };
    function showReport(r){
      openModal({title:r.title,icon:'file-text',wide:true,body:`
        <div style="border:1px solid var(--line2);border-radius:12px;padding:18px;background:rgba(3,7,18,.4)">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:14px">
            <div><b style="font-family:var(--fontHead);letter-spacing:.12em;font-size:.9rem">SPACE INTELLIGENCE SYSTEM</b>
            <div style="font-size:.62rem;color:var(--muted)">Beyond Earth, Beyond Intelligence · CONFIDENTIAL-DEMO</div></div>
            <div style="font-size:.66rem;color:var(--muted);text-align:right">Dok: SIS/RPT/${r.id}<br>${fmtDate(r.created)} · data stamp ${esc(r.dataStamp)}</div>
          </div>
          <h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">1. EXECUTIVE SUMMARY</h4>
          <p style="font-size:.8rem;line-height:1.75;margin:6px 0 12px">${esc(r.exec)}</p>
          <h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">2. TEMUAN UTAMA</h4>
          <ul style="font-size:.8rem;line-height:1.8;margin:6px 0 12px;padding-left:18px">${r.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
          ${r.charts&&r.charts.length?`<h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">3. GRAFIK PENDUKUNG</h4>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px">${r.charts.map(c=>c?`<img src="${c}" style="max-width:340px;border:1px solid var(--line2);border-radius:8px;background:#fff">`:'').join('')}</div>`:''}
          <h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">4. ANALISIS</h4>
          <p style="font-size:.8rem;line-height:1.75;white-space:pre-wrap;margin:6px 0 12px">${esc(r.analysis)}</p>
          <h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">5. KESIMPULAN</h4>
          <p style="font-size:.8rem;line-height:1.75;margin:6px 0 12px">${esc(r.conclusion)}</p>
          <h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">6. REKOMENDASI</h4>
          <ol style="font-size:.8rem;line-height:1.8;margin:6px 0 12px;padding-left:18px">${r.recommendations.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
          <h4 style="font-family:var(--fontHead);font-size:.8rem;color:#7dd3fc;letter-spacing:.1em">7. SUMBER</h4>
          <ul style="font-size:.72rem;line-height:1.8;margin:6px 0 8px;padding-left:18px">${r.sources.map(s=>`<li>${esc(s[0])} — <a href="${s[1]}" target="_blank" rel="noopener">${esc(s[1])}</a></li>`).join('')}</ul>
          <div class="note">${r.sim?'SELURUH ANGKA DALAM LAPORAN INI BERASAL DARI DATASET SIMULASI KECUALI YANG DIKUTIP DARI SUMBER RESMI.':'Data campuran live/demo — lihat label tiap modul sumber.'} Waktu pembaruan data: ${esc(r.dataStamp)}.</div>
        </div>`,
        footer:`<button class="btn" data-print><i data-lucide="printer"></i> Cetak / PDF</button>
        <button class="btn" data-csv><i data-lucide="table"></i> CSV</button>
        <button class="btn" data-json><i data-lucide="braces"></i> JSON</button>
        <button class="btn primary" data-x2>Tutup</button>`,
        bind(el,close){
          el.querySelector('[data-x2]').onclick=close;
          el.querySelector('[data-print]').onclick=()=>{
            const pa=$('#printArea');
            pa.innerHTML=`<h1 style="font-family:Orbitron,Georgia,serif">${esc(r.title)}</h1>
            <p>SPACE INTELLIGENCE SYSTEM · ${esc(r.type)} · ${esc(r.periodLabel)} · dibuat ${fmtDate(r.created)}</p><hr>
            <h2>1. Executive Summary</h2><p>${esc(r.exec)}</p>
            <h2>2. Temuan Utama</h2><ul>${r.findings.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>
            ${(r.charts||[]).filter(Boolean).map(c=>`<img src="${c}" style="max-width:520px">`).join('')}
            <h2>3. Analisis</h2><p>${esc(r.analysis)}</p>
            <h2>4. Kesimpulan</h2><p>${esc(r.conclusion)}</p>
            <h2>5. Rekomendasi</h2><ol>${r.recommendations.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>
            <h2>6. Sumber</h2><ul>${r.sources.map(s=>'<li>'+esc(s[0])+' — '+esc(s[1])+'</li>').join('')}</ul>
            <p><i>${r.sim?'Semua angka = dataset simulasi kecuali dikutip dari sumber resmi.':''}</i></p>`;
            window.print();
          };
          el.querySelector('[data-csv]').onclick=()=>exportReportCSV(r);
          el.querySelector('[data-json]').onclick=()=>download(r.title.replace(/\s+/g,'_')+'.json',JSON.stringify(r,null,2),'application/json');
        }});
      refreshIcons($('#view'));
    }
    function exportReportCSV(r){
      const rows=[['Bagian','Isi'],['Judul',r.title],['Jenis',r.type],['Periode',r.periodLabel],['Dibuat',fmtDate(r.created)],['Data stamp',r.dataStamp],[],['Executive Summary',r.exec]];
      r.findings.forEach((f,i)=>rows.push(['Temuan '+(i+1),f]));
      rows.push([],['Analisis',r.analysis],['Kesimpulan',r.conclusion]);
      r.recommendations.forEach((x,i)=>rows.push(['Rekomendasi '+(i+1),x]));
      r.sources.forEach(s=>rows.push(['Sumber',s[0]+' — '+s[1]]));
      download(r.title.replace(/\s+/g,'_')+'.csv','\uFEFF'+toCSV(rows),'text/csv');
      toast('CSV diekspor',r.title,'ok');
    }
    refreshIcons(view);
  }
});

/* ---------------- ALERT CENTER ---------------- */
function seedAlerts(){ if(!COLL.alerts){ COLL.alerts=JSON.parse(JSON.stringify(ALERTS_SEED)); persist('alerts'); } }
const ALERT_CATS=['Solar Activity Alert','Geomagnetic Storm Alert','Asteroid Approach Alert','Satellite Status Alert','Space Debris Alert','Mission Update','Signal Detection','Data Connection Alert','System Notification'];
REG({
  id:'alerts',icon:'bell-ring',sec:'sys',
  name:{id:'Alert Center',en:'Alert Center'},
  sub:{id:'Notifikasi & peringatan: prioritas, mark-as-read, riwayat, simulasi alert & pengaturan suara.',en:'Notification hub: priorities, mark-as-read, history, simulated alerts & sound settings.'},
  render(view){
    seedAlerts();
    view.innerHTML=`
    <div class="page-head">
      <div><h1><i data-lucide="bell-ring"></i> ${esc(L(this.name))}</h1><p>${esc(L(this.sub))}</p></div>
      <div class="page-actions">
        <button class="btn ok" id="alMarkAll"><i data-lucide="check-check"></i> Mark all read</button>
        <button class="btn" id="alSim"><i data-lucide="siren"></i> Simulasi alert</button>
        <button class="btn danger" id="alClear"><i data-lucide="trash-2"></i> Bersihkan riwayat</button>
      </div>
    </div>
    <div class="kpi-grid mb">
      ${kpiCard({icon:'bell',label:'Belum dibaca',val:unreadAlerts(),status:'UNREAD',stCls:'st-warn',tone:'warn',dir:'flat',delta:'—'})}
      ${kpiCard({icon:'list',label:'Total notifikasi',val:COLL.alerts.length,status:'HISTORY',stCls:'st-info',dir:'flat',delta:'lokal'})}
      ${kpiCard({icon:'octagon-alert',label:'Prioritas High',val:COLL.alerts.filter(a=>a.prio==='High').length,status:'WATCH',stCls:'st-bad',tone:'bad',dir:'flat',delta:'—'})}
      ${kpiCard({icon:'volume-2',label:'Suara notifikasi',val:SET.sound?'ON':'OFF',status:'SETTING',stCls:'st-cos',dir:'flat',delta:'klik test di bawah'})}
    </div>
    <div class="panel mb">
      <div class="panel-h"><h3><i data-lucide="inbox"></i> Kotak Peringatan</h3><div class="spacer"></div>
        <select id="alCatF" class="btn" style="padding:7px 10px"><option value="all">Semua kategori</option>${ALERT_CATS.map(c=>`<option>${c}</option>`).join('')}</select>
        <select id="alPrioF" class="btn" style="padding:7px 10px"><option value="all">Semua prioritas</option><option>High</option><option>Medium</option><option>Low</option></select>
        <button class="chip" id="alUnread">Belum dibaca saja</button></div>
      <div class="panel-b" id="alList"></div>
    </div>
    <div class="panel"><div class="panel-h"><h3><i data-lucide="settings-2"></i> Pengaturan Notifikasi</h3></div>
      <div class="panel-b">
        <div class="set-row"><div class="info"><b>Suara notifikasi</b><span>Bunyi beep WebAudio saat toast/alert muncul</span></div>
          <label class="switch"><input type="checkbox" id="alSound" ${SET.sound?'checked':''}><i></i></label>
          <button class="btn sm" id="alTest">Test suara</button></div>
        <div class="set-row"><div class="info"><b>Notifikasi pop-up</b><span>Tampilkan toast untuk event sistem</span></div>
          <label class="switch"><input type="checkbox" id="alPop" ${SET.notify?'checked':''}><i></i></label></div>
        <div class="note">Peringatan simulasi selalu diberi badge <b>SIMULASI</b> dan tidak menyerupai format alert resmi NOAA/NASA.</div>
      </div></div>`;
    const drawList=()=>{
      const cat=$('#alCatF').value,prio=$('#alPrioF').value,un=$('#alUnread').classList.contains('active');
      let list=COLL.alerts.filter(a=>(cat==='all'||a.cat===cat)&&(prio==='all'||a.prio===prio)&&(!un||!a.read));
      const ra=realAlerts().filter(a=>prio==='all'||a.prio===prio);
      $('#alList').innerHTML=(ra.length?`<div class="note ok" style="margin-bottom:8px"><b>${ra.length} peringatan NYATA</b> digabung dari feed LIVE NOAA SWPC & USGS — di atas riwayat lokal berlabel SIMULASI.</div>`+ra.map(a=>`
        <div class="list-row"><i data-lucide="siren" style="color:${a.prio==='High'?'var(--danger)':'var(--warn)'}"></i>
        <div class="body"><b>${esc(a.title)}</b><p>${esc(a.msg)}</p>
        <div class="meta"><span class="badge b-live">LIVE · ${esc(a.src)}</span><span>${fmtDate(a.ts)}</span></div></div></div>`).join(''):'')+
        (list.length?list.map(a=>`
        <div class="list-row" style="opacity:${a.read?.55:1}">
          <i data-lucide="${a.prio==='High'?'octagon-alert':a.prio==='Medium'?'triangle-alert':'info'}" style="color:${a.prio==='High'?'var(--danger)':a.prio==='Medium'?'var(--warn)':'var(--dim)'}"></i>
          <div class="body"><b>${esc(a.title)} ${!a.read?'<span class="dot d-warn" style="display:inline-block"></span>':''}</b><p>${esc(a.msg)}</p>
          <div class="meta"><span class="badge b-hist">${esc(a.cat)}</span><span class="badge ${a.prio==='High'?'b-off':a.prio==='Medium'?'b-sim':'b-gray'}">${esc(a.prio)}</span>
          <span>${fmtDate(a.ts)}</span>${a.sim?'<span class="badge b-sim">SIMULASI</span>':''}
          ${!a.read?`<button class="btn sm" data-read="${a.id}">Mark as read</button>`:''}</div></div></div>`).join('')
        :'<div class="empty">Tidak ada alert sesuai filter.</div>');
      $$('#alList [data-read]').forEach(b=>b.onclick=()=>{ const a=COLL.alerts.find(x=>x.id===b.dataset.read); a.read=true; persist('alerts'); refreshAlertBadges(); drawList(); });
      refreshIcons($('#alList'));
    };
    drawList();
    $('#alCatF').onchange=drawList; $('#alPrioF').onchange=drawList;
    $('#alUnread').onclick=e=>{ e.target.classList.toggle('active'); drawList(); };
    $('#alMarkAll').onclick=()=>{ COLL.alerts.forEach(a=>a.read=true); persist('alerts'); refreshAlertBadges(); drawList(); toast('Semua dibaca','Seluruh peringatan ditandai terbaca.','ok'); };
    $('#alSim').onclick=()=>{
      const sims=[
        {cat:'Space Weather Alert',prio:'High',title:'Simulasi: Flare X1.1 terdeteksi',msg:'Alert simulasi uji — blackout radio HF sisi siang diprediksi 30 menit.'},
        {cat:'Space Debris Alert',prio:'Medium',title:'Simulasi: fragmentasi event terdeteksi',msg:'Alert simulasi uji — ±40 fragmen baru pada pita 700 km.'},
        {cat:'Satellite Status Alert',prio:'Low',title:'Simulasi: battery degradation DEMO-SAT-1',msg:'Alert simulasi uji — tren SoH −2%/bulan.'},
        {cat:'Asteroid Approach Alert',prio:'Medium',title:'Simulasi: pendekatan NEO < 5 jt km',msg:'Alert simulasi uji — objek demo melintas aman.'}
      ];
      const s=pick(sims); s.id='a-'+uid(); s.ts=Date.now(); s.sim=true; s.read=false;
      COLL.alerts.unshift(s); persist('alerts'); refreshAlertBadges(); drawList();
      if(SET.sound) beep(440,.2);
      toast('Alert baru',s.title,'warn');
      logAct('alert','Simulasi alert dibuat: '+s.title);
    };
    $('#alClear').onclick=async()=>{
      if(await confirmDialog('Bersihkan riwayat','Seluruh notifikasi akan dihapus. Lanjutkan?')){
        COLL.alerts=[]; persist('alerts'); refreshAlertBadges(); navTo('alerts',true);
      }
    };
    $('#alSound').onchange=e=>{ SET.sound=e.target.checked; saveSet(); if(SET.sound) beep(660,.12); };
    $('#alPop').onchange=e=>{ SET.notify=e.target.checked; saveSet(); };
    $('#alTest').onclick=()=>{ beep(660,.15); setTimeout(()=>beep(880,.15),180); };
    refreshIcons(view);
  }
});
/* ================================================================

   ================================================================ */
const DM_COLLECTIONS=[

const SUPA_SQL=`-- SIS Supabase schema — jalankan PENUH di SQL Editor project yang SAMA dengan URL aplikasi
create table if not exists sis_records (
  id uuid primary key default gen_random_uuid(),
  collection text not null,
  record_id text not null,
  payload jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now(),
  unique (collection, record_id)
);
alter table sis_records enable row level security;

-- GRANT eksplisit (penting: project baru Supabase dapat dibuat tanpa grants default ke anon)
grant usage on schema public to anon, authenticated;
grant select, insert, update, delete on table sis_records to anon, authenticated;

-- DEMO-ONLY policy: izinkan anon key menulis/membaca (ganti policy ketat untuk produksi!)
drop policy if exists "sis anon demo access" on sis_records;
create policy "sis anon demo access" on sis_records
  for all to anon using (true) with check (true);

-- Tabel cache API — dipakai juga untuk sinkronisasi pengaturan antar perangkat
-- (source='sis_settings': URL + anon key + opsi kunci NASA)
create table if not exists api_cache (
  source text primary key,
  payload jsonb not null default '{}'::jsonb,
  fetched_at timestamptz not null default now()
);
alter table api_cache enable row level security;
grant select, insert, update, delete on table api_cache to anon, authenticated;
drop policy if exists "sis cache anon" on api_cache;
create policy "sis cache anon" on api_cache
  for all to anon using (true) with check (true);

-- Verifikasi: harus muncul baris privileges untuk anon & authenticated
select grantee, privilege_type from information_schema.role_table_grants
where table_name in ('sis_records','api_cache') order by grantee, table_name;`;
/* Uji koneksi NASA api_key — 1 request ke APOD; tampilkan VALID / INVALID / sisa kuota */
async function testNasaKey(){
  const inp=$('#setNasa'); const key=(inp&&inp.value.trim())||(SET.nasaKey||'DEMO_KEY');
  const out=$('#nasaTestOut'); if(!out) return;
  out.innerHTML='<span class="badge b-gray">Menguji api.nasa.gov…</span>';
  const t0=Date.now();
  try{
    const res=await fetch('https://api.nasa.gov/planetary/apod?api_key='+encodeURIComponent(key));
    const ms=Date.now()-t0;
    const lim=res.headers.get('X-RateLimit-Limit'), rem=res.headers.get('X-RateLimit-Remaining');
    const kuota=(lim!==null&&lim!==undefined)?('Kuota saat ini: <b>'+esc(String(rem==null?'?':rem))+'</b> request tersisa dari <b>'+esc(String(lim))+'</b>. '):'Kuota tidak dapat dibaca dari browser. ';
    if(res.ok){
      const d=await res.json().catch(()=>({}));
      out.innerHTML='<div class="note blue"><b style="color:#00E676">VALID &amp; AKTIF</b> — HTTP 200 dalam '+ms+' ms. '+kuota+'Uji konten: APOD "'+esc(String(d.title||'—').slice(0,70))+'" ('+esc(String(d.date||'—'))+'). NeoWs, DONKI, dan APOD siap memakai kunci ini.</div>';
      markSource('nasaKey','NASA api_key (uji APOD)','LIVE','https://api.nasa.gov');
      logAct('nasa','NASA api_key VALID — APOD 200 OK ('+ms+' ms)');
      toast('NASA api_key aktif','HTTP 200 — kunci valid, kuota tersedia.','ok');
    } else if(res.status===403){
      out.innerHTML='<div class="note red"><b style="color:#FF3B5C">TIDAK VALID</b> — HTTP 403 dari api.nasa.gov ('+ms+' ms). Kunci salah, kadaluarsa, atau dihapus. Daftar gratis di api.nasa.gov → Generate API Key (kunci dikirim ke email), lalu isi ulang di kolom NASA api_key dan uji lagi.</div>';
      markSource('nasaKey','NASA api_key (uji APOD)','UNAVAILABLE','https://api.nasa.gov');
      logAct('nasa','NASA api_key ditolak — HTTP 403 (kunci tidak valid)');
      toast('NASA api_key ditolak','HTTP 403 — kunci tidak valid.','warn');
    } else if(res.status===429){
      out.innerHTML='<div class="note"><b style="color:#FFB020">KUNCI DITERIMA TAPI KUOTA HABIS</b> — HTTP 429 OVER_RATE_LIMIT ('+ms+' ms). '+kuota+'Pada DEMO_KEY kuota dibagi rata dengan semua pengguna IP yang sama sehingga cepat habis. Daftar kunci pribadi gratis di api.nasa.gov untuk kuota jauh lebih besar, atau coba lagi nanti.</div>';
      markSource('nasaKey','NASA api_key (uji APOD)','CACHED','https://api.nasa.gov');
      logAct('nasa','NASA api_key over rate limit — HTTP 429');
      toast('Kuota NASA API habis','Kunci diterima tapi over rate limit (429).','warn');
    } else {
      out.innerHTML='<div class="note"><b>HTTP '+res.status+'</b> — respons tidak terduga dari api.nasa.gov.</div>';
      logAct('nasa','Uji NASA api_key: HTTP '+res.status);
    }
  }catch(e){
    out.innerHTML='<div class="note"><b>GAGAL JARINGAN</b> — '+esc(String((e&&e.message)||e))+' Periksa koneksi internet. Saat offline uji tidak bisa dijalankan; aplikasi tetap berjalan lokal.</div>';
    logAct('nasa','Uji NASA api_key gagal — jaringan tidak tersedia');
  }
}

function openPalette(){
  const root=$('#paletteRoot');
  root.innerHTML=`<div class="modal-ov" style="align-items:flex-start"><div class="palette-box">
    <input id="palIn" placeholder="Ketik perintah, modul, atau objek…" autocomplete="off">
    <div class="palette-list" id="palList"></div>
  </div></div>`;
  const close=()=>root.innerHTML='';
  root.querySelector('.modal-ov').addEventListener('mousedown',e=>{ if(e.target.classList.contains('modal-ov')) close(); });
  const items=()=>PAGES.map(p=>({icon:p.icon,label:L(p.name),hint:'modul',run:()=>navTo(p.id)}))
    .concat(paletteActions());
  let sel=0,cur=items();
  const draw=()=>{
    $('#palList').innerHTML=cur.length?cur.map((it,i)=>`<div class="pal-item ${i===sel?'sel':''}" data-i="${i}"><i data-lucide="${it.icon}"></i>${esc(it.label)}<small>${esc(it.hint||'')}</small></div>`).join(''):'<div class="empty">Tidak ada hasil.</div>';
    refreshIcons($('#palList'));
    $$('#palList .pal-item').forEach(el=>el.onclick=()=>{ cur[+el.dataset.i].run(); close(); });
  };
  draw();
  const inp=$('#palIn');
  inp.focus();
  inp.oninput=()=>{
    const q=inp.value.toLowerCase();
    cur=items().filter(it=>it.label.toLowerCase().includes(q));
    sel=0; draw();
  };
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,cur.length-1);draw();}
    else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();}
    else if(e.key==='Enter'&&cur[sel]){cur[sel].run();close();}
    else if(e.key==='Escape') close();
  };
}
