function openGlobalResults(q){
  const ql=q.toLowerCase();
  const groups=[
    ['Modul',PAGES.filter(p=>L(p.name).toLowerCase().includes(ql)).map(p=>({icon:p.icon,label:L(p.name),run:()=>navTo(p.id)}))],
    ['Objek Tata Surya',PLANETS.filter(p=>p.name.toLowerCase().includes(ql)).map(p=>({icon:'orbit',label:p.name,hint:p.cls,run:()=>{navTo('solar');setTimeout(()=>openPlanetModal(p),150);}}))],
    ['Satelit',SATS.filter(s=>s.name.toLowerCase().includes(ql)||String(s.norad).includes(ql)).slice(0,6).map(s=>({icon:'satellite',label:s.name,hint:s.orbit+' · NORAD '+s.norad,run:()=>{navTo('sat');setTimeout(()=>openSatDetail(s),150);}}))],
    ['NEO',NEOS.filter(n=>n.name.toLowerCase().includes(ql)).map(n=>({icon:'triangle-alert',label:n.name,hint:n.pha?'PHA':'NEO',run:()=>{navTo('neo');setTimeout(()=>openNeoDetail(n),150);}}))],
    ['Eksoplanet',EXOS.filter(e=>e.name.toLowerCase().includes(ql)||e.star.toLowerCase().includes(ql)).slice(0,6).map(e=>({icon:'droplets',label:e.name,hint:e.dist+' ly',run:()=>{navTo('exo');setTimeout(()=>openExoDetail(e),150);}}))],
    ['Deep Space',DEEPS.filter(d=>d.name.toLowerCase().includes(ql)).slice(0,6).map(d=>({icon:'sparkles',label:d.name,hint:d.cat,run:()=>{navTo('deep');setTimeout(()=>openDeepDetail(d),150);}}))],
    ['Misi',(COLL.missions||MISSIONS_SEED).filter(m=>m.name.toLowerCase().includes(ql)).slice(0,6).map(m=>({icon:'rocket',label:m.name,hint:m.status,run:()=>navTo('mission')}))]
  ].filter(g=>g[1].length);
  openModal({title:'Hasil Pencarian — "'+q+'"',icon:'search',body:
    groups.length?groups.map(g=>`<h4 style="font-family:var(--fontHead);font-size:.7rem;letter-spacing:.12em;color:#7dd3fc;margin:12px 0 6px">${g[0].toUpperCase()} (${g[1].length})</h4>`+
      g[1].map(it=>`<div class="list-row" style="cursor:pointer" data-run><i data-lucide="${it.icon}"></i><div class="body"><b>${esc(it.label)}</b>${it.hint?`<p>${esc(it.hint)}</p>`:''}</div></div>`).join('')).join('')
    :'<div class="empty">Tidak ditemukan. Coba: "Mars", "ISS", "Apophis", "TRAPPIST", "Crab".</div>',
    bind(el,close){
      let idx=0;
      el.querySelectorAll('[data-run]').forEach((row,i)=>{
        const grp=groups.slice().filter(g=>g[1].length);
        let acc=0,found=null;
        grp.forEach(g=>{ if(i>=acc&&i<acc+g[1].length){found=g[1][i-acc];} acc+=g[1].length; });
        row.onclick=()=>{ close(); found&&found.run(); };
      });
    }});

  openModal({title:'Keyboard Shortcuts',icon:'terminal-square',narrow:true,body:`
    ${[['Ctrl + K','Buka command palette'],['Ctrl + /','Buka daftar shortcut ini'],['Alt + 1…9','Navigasi cepat ke modul 1–9'],['Alt + P','Presentation mode'],['Ctrl + Shift + C','Scientific calculator'],['Ctrl + Shift + O','Observation calendar'],['Esc','Tutup modal / palette / presentasi'],['Scroll / Drag di scene 3D','Zoom / rotasi kamera']]
    .map(s=>`<div class="kbd-row"><span>${s[1]}</span><kbd>${s[0]}</kbd></div>`).join('')}
    <div class="note blue">Shortcut bekerja di seluruh aplikasi. Pada mode presentasi, panah kiri/kanan berpindah modul.</div>`});
}
/* ---- Scientific calculator ---- */
function evalMath(expr){
  let e=expr.toLowerCase()
    .replace(/×|·/g,'*').replace(/÷/g,'/').replace(/,/g,'.')
    .replace(/\^/g,'**')
    .replace(/π|pi/g,'Math.PI')
    .replace(/\be\b(?![a-z])/g,'Math.E')
    .replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
    .replace(/asin\(/g,'Math.asin(').replace(/acos\(/g,'Math.acos(').replace(/atan\(/g,'Math.atan(')
    .replace(/log10\(/g,'Math.log10(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(')
    .replace(/sqrt\(|√\(/g,'Math.sqrt(').replace(/abs\(/g,'Math.abs(').replace(/exp\(/g,'Math.exp(')
    .replace(/floor\(/g,'Math.floor(').replace(/ceil\(/g,'Math.ceil(').replace(/round\(/g,'Math.round(')
    .replace(/\^/g,'');
  if(!/^[0-9+\-*/().%\s]|Math/.test(e[0]||'')) {}
  if(/[a-z_]+/i.test(e.replace(/Math\.(PI|E|sin|cos|tan|asin|acos|atan|log10|log|sqrt|abs|exp|floor|ceil|round)/g,''))) throw new Error('karakter tidak diizinkan');
  const v=Function('"use strict";return('+e+')')();
  if(typeof v!=='number'||isNaN(v)) throw new Error('hasil bukan angka');
  return v;
}
function openCalc(){
  openModal({title:'Scientific Calculator',icon:'calculator',narrow:true,body:`
    <input id="calcIn" placeholder="mis. sqrt(16) + 2^10 * sin(pi/6) · pi · ln(e) · log10(1000)" style="width:100%;background:rgba(3,7,18,.5);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:12px 14px;font-size:1rem;outline:none;font-family:ui-monospace,monospace">
    <div id="calcOut" style="font-family:var(--fontHead);font-size:1.5rem;color:var(--neon);text-align:right;margin:12px 0;min-height:34px"></div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
      ${['7','8','9','/','sqrt(','4','5','6','*','^','1','2','3','-','sin(','0','.','(',')','+','pi','e','log(','ln(','cos('].map(b=>`<button class="btn" data-c="${esc(b)}" style="justify-content:center">${esc(b==='sqrt('?'√':b==='sin('?'sin':b==='cos('?'cos':b==='log('?'log':b==='ln('?'ln':b)}</button>`).join('')
      }<button class="btn danger" data-c="C" style="grid-column:2/5;justify-content:center">Clear</button><button class="btn primary" data-c="=" style="justify-content:center">=</button>
    </div>
    <div class="note blue">Didukung: + − × ÷ ^ ( ) , sqrt, sin/cos/tan (radian), asin/acos/atan, log (basis 10), ln, exp, abs, floor/ceil/round, pi, e. Evaluasi lokal — tidak ada data yang dikirim.</div>`,
    bind(el){
      const inp=el.querySelector('#calcIn'),out=el.querySelector('#calcOut');
      const calc=()=>{
        try{ out.textContent='= '+evalMath(inp.value); }
        catch(err){ out.textContent='⚠ '+err.message; out.style.color='var(--danger)'; return; }
        out.style.color='var(--neon)';
      };
      el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
        const v=b.dataset.c;
        if(v==='C'){ inp.value=''; out.textContent=''; }
        else if(v==='=') calc();
        else inp.value+=v;
        inp.focus();
      });
      inp.onkeydown=e=>{ if(e.key==='Enter') calc(); };
      inp.focus();
    }});
}
/* ---- Observation calendar ---- */
let CAL_Y,CAL_M;
function openCalendar(){
  const now=new Date(); CAL_Y=CAL_Y||now.getFullYear(); CAL_M=CAL_M??now.getMonth();
  const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  openModal({title:'Observation Calendar — '+months[CAL_M]+' '+CAL_Y,icon:'calendar-days',wide:true,body:`<div id="calBody"></div>`,
    footer:`<button class="btn" id="calPrev">‹ Bulan</button><button class="btn" id="calNext">Bulan ›</button><button class="btn primary" data-x2>Tutup</button>`,
    bind(el,close){
      const draw=()=>{
        const first=new Date(CAL_Y,CAL_M,1),days=new Date(CAL_Y,CAL_M+1,0).getDate();
        const startPad=(first.getDay()+6)%7;
        let cells='';
        for(let i=0;i<startPad;i++) cells+='<div class="cal-day off"></div>';
        for(let d=1;d<=days;d++){
          const ds=`${CAL_Y}-${String(CAL_M+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const md=ds.slice(5);
          const met=METEORS.filter(m=>m.d===md);
          const usr=(COLL.calEvents||[]).filter(e=>e.date===ds);
          const today=ds===new Date().toISOString().slice(0,10);
          cells+=`<div class="cal-day ${today?'today':''}" data-d="${ds}"><div class="dnum">${d}</div>
            ${met.map(m=>`<div class="cal-ev meteor" data-m="${esc(m.n)}">☄ ${esc(m.n.split(' —')[0])}</div>`).join('')}
            ${usr.map(u=>`<div class="cal-ev" data-u="${esc(u.title)}">${esc(u.title)}</div>`).join('')}</div>`;
        }
        el.querySelector('#calBody').innerHTML=`<div style="display:grid;grid-template-columns:repeat(7,1fr);font-size:.62rem;color:var(--dim);letter-spacing:.1em;margin-bottom:6px">${['SEN','SEL','RAB','KAM','JUM','SAB','MIN'].map(d=>`<span style="text-align:center">${d}</span>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
        <div class="note blue">Meteor shower = perkiraan puncak tahunan (IMO/AMS). Klik hari untuk menambah agenda observasi Anda (tersimpan lokal).</div>`;
        el.querySelectorAll('[data-d]').forEach(c=>c.onclick=e=>{
          if(e.target.dataset.u||e.target.dataset.m) return;
          const ds=c.dataset.d;
          openModal({title:'Tambah Agenda — '+ds,icon:'plus',narrow:true,body:`
            <div class="field"><label>Judul observasi <span class="req">*</span></label><input id="ceT" placeholder="mis. Observasi ISS transit"><div class="ferr">Judul wajib.</div></div>
            <div class="field"><label>Tipe</label><input id="ceTy" placeholder="mis. transit, eclipse, tracking"></div>`,
            footer:'<button class="btn" data-x2>Batal</button><button class="btn primary" data-ok>Simpan</button>',
            bind(el2,close2){
              el2.querySelector('[data-x2]').onclick=close2;
              el2.querySelector('[data-ok]').onclick=()=>{
                const t=el2.querySelector('#ceT').value.trim();
                if(!t){ el2.querySelector('#ceT').closest('.field').classList.add('err'); return; }
                COLL.calEvents=COLL.calEvents||[];
                COLL.calEvents.push({id:uid(),date:ds,title:t,type:el2.querySelector('#ceTy').value.trim()||'umum'});
                persist('calEvents'); close2(); draw();
                toast('Agenda ditambahkan',t+' · '+ds,'ok');
              };
            }});
        });
        el.querySelectorAll('[data-u]').forEach(elm=>elm.onclick=e=>{
          e.stopPropagation();
          const t=elm.dataset.u;
          openModal({title:t,icon:'calendar-days',narrow:true,body:`<p style="font-size:.8rem">Agenda observasi pribadi Anda.</p>`,footer:`<button class="btn danger" data-del>Hapus agenda</button><button class="btn" data-x2>Tutup</button>`,bind(el3,close3){
            el3.querySelector('[data-x2]').onclick=close3;
            el3.querySelector('[data-del]').onclick=async()=>{
              if(await confirmDialog('Hapus agenda','Agenda "'+t+'" akan dihapus.')){
                COLL.calEvents=(COLL.calEvents||[]).filter(x=>x.title!==t||x.date!==elm.closest('[data-d]').dataset.d);
                persist('calEvents'); close3(); close(); openCalendar();
              }
            };
          }});
        });
        el.querySelectorAll('[data-m]').forEach(elm=>elm.onclick=e=>{
          e.stopPropagation();
          const m=METEORS.find(x=>x.n===elm.dataset.m)||METEORS.find(x=>x.n.startsWith(elm.dataset.m));
          openModal({title:elm.dataset.m,icon:'meteor',body:`<p style="font-size:.82rem;line-height:1.7">Perkiraan puncak tahunan (IMO/AMS). Radiant ${esc((elm.dataset.m||'').split('—')[0])}. Faktor terbaik: langit gelap, bulan rendah, jam 00–04 lokal. ZHR tergantung kondisi.</p><div class="note blue">Gunakan tabung apapun — meteor shower paling nyaman dilihat mata telanjang.</div>`,footer:'<button class="btn primary" data-x2>Tutup</button>',bind(el4,close4){el4.querySelector('[data-x2]').onclick=close4;}});
        });
      };
      draw();
      el.querySelector('#calPrev').onclick=()=>{ CAL_M--; if(CAL_M<0){CAL_M=11;CAL_Y--;} close(); openCalendar(); };
      el.querySelector('#calNext').onclick=()=>{ CAL_M++; if(CAL_M>11){CAL_M=0;CAL_Y++;} close(); openCalendar(); };
      el.querySelector('[data-x2]').onclick=close;
    }});
}
/* ---- Keyboard global ---- */
function bindKeys(){
  document.addEventListener('keydown',e=>{
    const inField=/input|textarea|select/i.test((e.target.tagName||''));
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
    else if((e.ctrlKey||e.metaKey)&&e.key==='/'){ e.preventDefault(); openShortcuts(); }
    else if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='c'){ e.preventDefault(); openCalc(); }
    else if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='o'){ e.preventDefault(); openCalendar(); }
    else if(e.altKey&&e.key.toLowerCase()==='p'){ e.preventDefault(); togglePresentation(); }
    else if(e.altKey&&/^[1-9]$/.test(e.key)){ e.preventDefault(); const p=PAGES[+e.key-1]; p&&navTo(p.id); }
    else if(e.key==='Escape'){
      if(STATE.presentation&&$('#modalRoot').children.length===0&&$('#paletteRoot').children.length===0) togglePresentation();
    }
    else if(STATE.presentation&&!inField&&['ArrowRight','ArrowLeft'].includes(e.key)){
      const i=PAGES.findIndex(p=>p.id===STATE.page);
      navTo(PAGES[(i+(e.key==='ArrowRight'?1:PAGES.length-1))%PAGES.length].id);
    }
  });
}
/* ---- Topbar & sidebar wiring ---- */
function bindChrome(){
  $('#btnSide').onclick=()=>{
    if(innerWidth<=980) $('#app').classList.toggle('side-open');
    else $('#app').classList.toggle('side-collapsed');
  };
  $('#btnTheme').onclick=()=>{ SET.theme=SET.theme==='dark'?'light':'dark'; saveSet(); applyTheme(); };
  $('#btnFull').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };
  $('#btnAlerts').onclick=()=>navTo('alerts');
  $('#btnPalette').onclick=openPalette;
  $('#connChip').onclick=()=>navTo('global');
  const gs=$('#globalSearch');
  gs.onkeydown=e=>{ if(e.key==='Enter'&&gs.value.trim()){ openGlobalResults(gs.value.trim()); gs.value=''; } };
  $('#app').addEventListener('click',e=>{
    if(innerWidth<=980&&!e.target.closest('#sidebar')&&!e.target.closest('#btnSide')) $('#app').classList.remove('side-open');
  });
}
/* ---- Refresh loop ---- */
let _refreshTimer=null;
function restartRefreshLoop(){
  if(_refreshTimer) clearInterval(_refreshTimer);
  _refreshTimer=setInterval(refreshLoop,Math.max(SET.refresh,30)*1000);
}
/* ---- Error handling ---- */
let _errShown=false;
window.addEventListener('error',e=>{
  console.error('SIS:',e.message);
  if(!_errShown){ _errShown=true; toast('Galat JS tertangani',(e.message||'unknown')+' — aplikasi tetap berjalan. Cek konsol untuk detail.','warn'); setTimeout(()=>_errShown=false,4000); }
});
window.addEventListener('unhandledrejection',e=>{ console.error('SIS promise:',e.reason); });
/* ---- BOOT ---- */
function boot(){
  if(window.__booted) return; window.__booted=true;
  // Tautan gabung (#sisjoin=…) — terapkan kredensial dari tautan antar perangkat (v2.2.1)
  try{
    const jm=(location.hash||'').match(/sisjoin=([^&]+)/);
    if(jm){
      const j=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(jm[1])))));
      if(j&&j.u&&j.k){
        COLL.supaCfg=Object.assign({},COLL.supaCfg||{},{url:j.u,key:j.k,table:j.t||'sis_records',auto:true});
        if(j.sk) SET.nasaKey=j.sk;
        persist('supaCfg'); saveSet();
        history.replaceState(null,'',location.pathname+location.search);
        setTimeout(()=>{ supaConnect()
          .then(()=>{ toast('Tautan gabung','Koneksi Supabase & kunci diterapkan — tersambung ke cloud.','ok'); const pg=PAGES.find(p=>p.id==='data'); if(pg&&pg.reload) pg.reload(); })
          .catch(err=>toast('Tautan gabung',err.message||String(err),'warn')); },900);
      }
    }
  }catch(e){ /* hash bukan sisjoin — abaikan */ }
  // CSS tambahan (badge kosmik + color-scheme + presentation mode)
  document.head.insertAdjacentHTML('beforeend',`<style>
  .badge.b-cos{background:rgba(139,92,246,.13);color:#b39dff;border:1px solid rgba(139,92,246,.35)}
  body.presentation #sidebar,body.presentation #topbar,body.presentation .footer-bar{display:none}
  body.presentation .main{margin-left:0}
  body.presentation #view{padding:30px}
  body.presentation .page-head h1{font-size:1.7rem}
  input,select,textarea{color-scheme:dark}
  [data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{color-scheme:light}
  </style>`);
  applyTheme();
  refreshIcons(document);
  initStarfield();
  missionsAll(); seedAlerts();
  if(!COLL.signals) COLL.signals=null; // signals default = SIGNALS_SEED live
  buildNav();
  const hash=(location.hash||'').replace('#','');
  const start=PAGES.find(p=>p.id===hash)?hash:'command';
  navTo(start,true);
  bindChrome();
  bindKeys();
  startClocks();
  restartRefreshLoop();
  refreshAlertBadges();
  updateConnChip(); updateFoot();
  // Supabase auto-connect bila dikonfigurasi
  if(COLL.supaCfg&&COLL.supaCfg.url&&COLL.supaCfg.key&&COLL.supaCfg.auto){
    supaConnect().then(()=>toast('Supabase tersambung','Sinkronisasi cloud aktif (auto).','ok'))
      .catch(err=>toast('Supabase gagal',(err.message||String(err))+' — berjalan lokal.','warn'));
  }
  // sambutan
  setTimeout(()=>toast('SIS v2.2.1 siap','Mode demo aktif — tekan Ctrl+K untuk command palette, Ctrl+/ untuk shortcut.','info'),900);
  logAct('system','SIS diinisialisasi (boot v2.2.1)');
}
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading'&&!window.__booted){ window.__booted=true; boot(); }
</script>
