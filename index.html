<head>

<title>SPACE INTELLIGENCE SYSTEM (SIS) — Beyond Earth, Beyond Intelligence</title>

<style>
/* ============================================================
   SPACE INTELLIGENCE SYSTEM (SIS) — Single-file application
   Palette: bg #030712 · panel #0B1220 · neon #00D4FF · cosmic #8B5CF6
   ok #00E676 · danger #FF3B5C · warn #FFB020 · text #F8FAFC
   ============================================================ */
:root{
  --bg:#030712; --panel:#0B1220; --panel2:#0d1628;
  --neon:#00D4FF; --cosmic:#8B5CF6; --ok:#00E676; --danger:#FF3B5C; --warn:#FFB020;
  --text:#F8FAFC; --muted:#94A3B8; --dim:#64748B;
  --line:rgba(0,212,255,.14); --line2:rgba(148,163,184,.12);
  --glass:linear-gradient(160deg,rgba(11,18,32,.92),rgba(3,7,18,.82));
  --glass2:linear-gradient(160deg,rgba(139,92,246,.10),rgba(0,212,255,.06));
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:14px; --sideW:262px; --sideMin:66px; --topH:60px;
  --fontHead:'Orbitron',ui-sans-serif,system-ui,sans-serif;
  --fontBody:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme="light"]{
  --bg:#e9edf4; --panel:#ffffff; --panel2:#f3f6fb;
  --text:#0f172a; --muted:#475569; --dim:#64748b;
  --line:rgba(11,90,140,.18); --line2:rgba(71,85,105,.16);
  --glass:linear-gradient(160deg,rgba(255,255,255,.96),rgba(240,245,252,.94));
  --glass2:linear-gradient(160deg,rgba(139,92,246,.10),rgba(0,150,220,.08));
  --shadow:0 10px 24px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:var(--fontBody); background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
body::before{ /* holographic grid haze */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(139,92,246,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(0,212,255,.09), transparent 60%);
}
[data-theme="light"] body::before{opacity:.35}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
a{color:var(--neon);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,212,255,.4);background-clip:content-box}

/* ---------- App shell ---------- */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
#sidebar{
  width:var(--sideW); flex:0 0 var(--sideW); position:fixed; top:0; bottom:0; left:0; z-index:50;
  background:linear-gradient(180deg,rgba(11,18,32,.97),rgba(3,7,18,.97));
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  transition:width .25s,transform .25s; overflow:hidden;
}
[data-theme="light"] #sidebar{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(240,245,252,.98))}
.app.side-collapsed #sidebar{width:var(--sideMin);flex-basis:var(--sideMin)}
.main{flex:1;margin-left:var(--sideW);transition:margin .25s;min-width:0;display:flex;flex-direction:column}
.app.side-collapsed .main{margin-left:var(--sideMin)}
.side-head{display:flex;align-items:center;gap:12px;padding:16px 14px 12px;border-bottom:1px solid var(--line2)}
.logo-badge{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#00D4FF22,#8B5CF633),var(--panel2);
  border:1px solid var(--line); position:relative; overflow:hidden;
}
.logo-badge::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 60deg,rgba(0,212,255,.35) 90deg,transparent 120deg);animation:spin 6s linear infinite}
.logo-badge svg,.logo-badge i{width:22px;height:22px;color:var(--neon);z-index:1}
.logo-badge .lucide{width:22px;height:22px}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-t{min-width:0}
.brand-t b{font-family:var(--fontHead);font-size:.95rem;letter-spacing:.14em;display:block;white-space:nowrap;
  background:linear-gradient(90deg,#7dd3fc,#00D4FF 40%,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-t span{font-size:.62rem;color:var(--muted);letter-spacing:.08em;white-space:nowrap;display:block}
.app.side-collapsed .brand-t,.app.side-collapsed .side-foot,.app.side-collapsed .nav-sec{display:none}
#nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 6px}
.nav-sec{font-size:.6rem;letter-spacing:.18em;color:var(--dim);padding:12px 12px 6px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;margin:2px 0;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--muted);cursor:pointer;font-size:.83rem;font-weight:500;
  transition:background .15s,color .15s,border .15s;white-space:nowrap;position:relative;
}
.nav-item .lucide,.nav-item .ic-fb{width:17px;height:17px;flex:0 0 17px}
.nav-item:hover{background:rgba(0,212,255,.07);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,212,255,.14),rgba(139,92,246,.10));color:#7dd3fc;border-color:var(--line);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--neon),var(--cosmic))}
.app.side-collapsed .nav-item{padding:11px 0;justify-content:center}
.app.side-collapsed .nav-item .nav-label{display:none}
.nav-item .nav-badge{margin-left:auto;font-size:.6rem;background:var(--danger);color:#fff;border-radius:20px;padding:1px 7px;font-weight:700}
.app.side-collapsed .nav-item .nav-badge{display:none}
.nav-item .tip{display:none}
.app.side-collapsed .nav-item:hover .tip{
  display:block;position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
  background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:5px 10px;border-radius:8px;font-size:.75rem;z-index:99;box-shadow:var(--shadow)}
.ic-fb{display:inline-grid;place-items:center;font-weight:700;color:var(--neon)}
.side-foot{padding:12px 14px;border-top:1px solid var(--line2);font-size:.66rem;color:var(--dim)}
.side-foot .dotrow{display:flex;align-items:center;gap:7px;margin-bottom:6px;color:var(--muted)}
.side-foot .mini{color:var(--dim);line-height:1.5}

/* ---------- Topbar ---------- */
#topbar{
  height:var(--topH);position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:rgba(3,7,18,.75);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line2);
}
[data-theme="light"] #topbar{background:rgba(255,255,255,.8)}
.tb-btn{
  height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel2);border:1px solid var(--line2);border-radius:10px;color:var(--muted);
  cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s;position:relative;
}
.tb-btn:hover{color:var(--text);border-color:var(--line);background:rgba(0,212,255,.08)}
.tb-btn .lucide{width:16px;height:16px}
.tb-btn .nbadge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:.58rem;font-weight:800;border-radius:20px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.tb-title{font-family:var(--fontHead);font-size:.92rem;letter-spacing:.1em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-spacer{flex:1}
.tb-clock{display:flex;gap:8px;align-items:center}
.clock-chip{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:4px 10px;text-align:center;min-width:86px}
.clock-chip small{display:block;font-size:.55rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.clock-chip b{font-family:var(--fontHead);font-size:.8rem;color:var(--neon);font-weight:600}
.clock-chip.loc b{color:var(--cosmic)}
.gsearch{position:relative;flex:0 1 300px;min-width:120px}
.gsearch input{
  width:100%;height:36px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  color:var(--text);padding:0 34px 0 34px;font-size:.8rem;outline:none;font-family:inherit;
}
.gsearch input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,212,255,.12)}
.gsearch .lucide{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--dim)}
.gsearch kbd{position:absolute;right:8px;top:7px;font-size:.6rem;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:2px 5px;background:rgba(3,7,18,.4)}
.conn-chip{display:inline-flex;align-items:center;gap:7px;font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:6px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);cursor:pointer}
.conn-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulse 1.8s infinite}
.conn-chip.live .dot{background:var(--ok)}
.conn-chip.sim .dot{background:var(--warn)}
.conn-chip.off .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
<style>
/* ---------- Page & panels ---------- */
#view{flex:1;padding:18px 18px 30px;min-width:0}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-family:var(--fontHead);font-size:clamp(1.05rem,2.6vw,1.5rem);letter-spacing:.12em;color:var(--text);display:flex;align-items:center;gap:10px}
.page-head h1 .lucide{width:22px;height:22px;color:var(--neon)}
.page-head p{color:var(--muted);font-size:.8rem;margin-top:5px;max-width:720px}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);backdrop-filter:blur(10px);position:relative;overflow:hidden;
}
.panel.pad{padding:16px}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px) 0 0/100% 26px,linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px) 0 0/26px 100%}
[data-theme="light"] .panel::before{opacity:.15}
.panel-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-h h3{font-family:var(--fontHead);font-size:.76rem;letter-spacing:.14em;color:#7dd3fc;text-transform:uppercase;display:flex;align-items:center;gap:8px}
[data-theme="light"] .panel-h h3{color:#0369a1}
.panel-h h3 .lucide{width:15px;height:15px;color:var(--neon)}
.panel-h .spacer{flex:1}
.panel-b{padding:14px 16px;position:relative}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-21{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 2fr}
.g-32{grid-template-columns:3fr 2fr}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:170px}
.chartbox.xs{height:64px}
.chartbox.lg{height:320px}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:13px 14px;position:relative;overflow:hidden;transition:transform .18s,border .18s}
.kpi:hover{transform:translateY(-3px);border-color:rgba(0,212,255,.4)}
.kpi::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--neon),transparent 70%)}
.kpi.warn::after{background:linear-gradient(90deg,var(--warn),transparent 70%)}
.kpi.bad::after{background:linear-gradient(90deg,var(--danger),transparent 70%)}
.kpi.ok::after{background:linear-gradient(90deg,var(--ok),transparent 70%)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kpi-top .lucide,.kpi-top .ic-fb{width:17px;height:17px;color:var(--neon)}
.kpi.warn .kpi-top .lucide{color:var(--warn)}.kpi.bad .kpi-top .lucide{color:var(--danger)}.kpi.ok .kpi-top .lucide{color:var(--ok)}
.kpi-top span{font-size:.66rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:600;line-height:1.3}
.kpi-val{font-family:var(--fontHead);font-size:1.5rem;font-weight:700;color:var(--text);line-height:1.15;word-break:break-word}
.kpi-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.kpi-delta{font-size:.68rem;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi-delta.up{color:var(--ok)}.kpi-delta.down{color:var(--danger)}.kpi-delta.flat{color:var(--muted)}
.kpi-status{font-size:.6rem;font-weight:800;letter-spacing:.08em;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.st-ok{background:rgba(0,230,118,.12);color:var(--ok);border:1px solid rgba(0,230,118,.3)}
.st-warn{background:rgba(255,176,32,.12);color:var(--warn);border:1px solid rgba(255,176,32,.3)}
.st-bad{background:rgba(255,59,92,.12);color:var(--danger);border:1px solid rgba(255,59,92,.3)}
.st-info{background:rgba(0,212,255,.1);color:var(--neon);border:1px solid rgba(0,212,255,.3)}
.st-cos{background:rgba(139,92,246,.12);color:#b39dff;border:1px solid rgba(139,92,246,.3)}
.spark{margin-top:4px}

/* ---------- Chips, badges, buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;cursor:pointer;
  font-size:.78rem;font-weight:600;border:1px solid var(--line2);background:var(--panel2);color:var(--text);
  transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--neon);box-shadow:0 0 12px rgba(0,212,255,.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .lucide{width:15px;height:15px}
.btn.primary{background:linear-gradient(90deg,rgba(0,212,255,.2),rgba(139,92,246,.22));border-color:var(--neon);color:#7dd3fc}
[data-theme="light"] .btn.primary{color:#0369a1}
.btn.danger{border-color:rgba(255,59,92,.4);color:var(--danger);background:rgba(255,59,92,.07)}
.btn.ok{border-color:rgba(0,230,118,.4);color:var(--ok);background:rgba(0,230,118,.07)}
.btn.sm{padding:5px 10px;font-size:.7rem;border-radius:8px}
.btn.icon{padding:7px;min-width:32px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;cursor:pointer;
  font-size:.72rem;font-weight:600;border:1px solid var(--line2);background:transparent;color:var(--muted);transition:all .15s;
}
.chip:hover{color:var(--text);border-color:var(--line)}
.chip.active{background:rgba(0,212,255,.14);color:var(--neon);border-color:var(--neon)}
.chip .lucide{width:12px;height:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.b-live{background:rgba(0,230,118,.13);color:var(--ok);border:1px solid rgba(0,230,118,.35)}
.b-sim{background:rgba(255,176,32,.13);color:var(--warn);border:1px solid rgba(255,176,32,.35)}
.b-hist{background:rgba(139,92,246,.13);color:#b39dff;border:1px solid rgba(139,92,246,.35)}
.b-cache{background:rgba(0,212,255,.1);color:var(--neon);border:1px solid rgba(0,212,255,.3)}
.b-off{background:rgba(255,59,92,.12);color:var(--danger);border:1px solid rgba(255,59,92,.35)}
.b-gray{background:rgba(148,163,184,.1);color:var(--muted);border:1px solid var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.d-ok{background:var(--ok);box-shadow:0 0 8px rgba(0,230,118,.7)}
.d-warn{background:var(--warn);box-shadow:0 0 8px rgba(255,176,32,.7)}
.d-bad{background:var(--danger);box-shadow:0 0 8px rgba(255,59,92,.7)}
.d-dim{background:var(--dim)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:12px;background:rgba(3,7,18,.35)}
[data-theme="light"] .tbl-wrap{background:rgba(240,246,255,.5)}
table.tbl{width:100%;border-collapse:collapse;font-size:.78rem;min-width:640px}
.tbl th{
  text-align:left;padding:10px 12px;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line2);background:rgba(11,18,32,.7);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap;z-index:2;
}
[data-theme="light"] .tbl th{background:rgba(243,246,251,.9)}
.tbl th:hover{color:var(--neon)}
.tbl td{padding:9px 12px;border-bottom:1px solid rgba(148,163,184,.08);color:var(--text);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s;cursor:default}
.tbl tbody tr:hover{background:rgba(0,212,255,.05)}
.tbl .mono{font-family:ui-monospace,'Cascadia Mono',Menlo,monospace;font-size:.74rem;color:#7dd3fc}
[data-theme="light"] .tbl .mono{color:#0369a1}
.empty,.loading,.errbox{
  padding:34px 18px;text-align:center;color:var(--dim);font-size:.82rem;border:1px dashed var(--line2);border-radius:12px;margin:8px 0;
}
.errbox{border-color:rgba(255,59,92,.4);color:var(--danger);background:rgba(255,59,92,.04)}
.loading .spin{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--neon);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:8px}
.progress{height:8px;background:rgba(148,163,184,.15);border-radius:8px;overflow:hidden;min-width:90px}
.progress i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--neon),var(--cosmic));transition:width .4s}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}

/* ---------- Forms ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:.68rem;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{
  width:100%;background:rgba(3,7,18,.5);border:1px solid var(--line2);border-radius:10px;color:var(--text);
  padding:9px 12px;font-size:.8rem;outline:none;font-family:inherit;transition:border .15s;
}
[data-theme="light"] .field input,[data-theme="light"] .field select,[data-theme="light"] .field textarea{background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:.66rem;color:var(--dim);margin-top:4px}
.field .ferr{font-size:.66rem;color:var(--danger);margin-top:4px;display:none}
.field.err input,.field.err select,.field.err textarea{border-color:var(--danger)}
.field.err .ferr{display:block}
.form-row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.switch{position:relative;width:42px;height:22px;flex:0 0 42px}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:rgba(148,163,184,.25);border-radius:20px;cursor:pointer;transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#cbd5e1;border-radius:50%;transition:.2s}
.switch input:checked+i{background:rgba(0,212,255,.4)}

.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row .info{flex:1;min-width:0}
.set-row .info b{font-size:.8rem;display:block}
.set-row .info span{font-size:.68rem;color:var(--dim);display:block;margin-top:2px}
.set-row select,.set-row input[type=number]{width:170px;flex:0 0 170px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:7px 10px;font-size:.76rem;outline:none}
.range{width:100%;accent-color:var(--neon)}

/* ---------- Modal ---------- */
.modal-ov{position:fixed;inset:0;z-index:100;background:rgba(3,7,18,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;animation:fadeIn .18s}
.modal{width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:slideUp .22s}
.modal.wide{width:min(1040px,100%)}
.modal.narrow{width:min(480px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.modal-h h3{font-family:var(--fontHead);font-size:.85rem;letter-spacing:.1em;color:var(--text);flex:1;min-width:0}
.modal-h .lucide{width:18px;height:18px;color:var(--neon)}
.modal-b{padding:16px 18px;overflow-y:auto;font-size:.82rem;line-height:1.6}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(360px,90vw)}
.toast{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:.78rem;
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);animation:slideUp .2s;
}
.toast .lucide{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.toast.ok .lucide{color:var(--ok)}.toast.warn .lucide{color:var(--warn)}.toast.err .lucide{color:var(--danger)}.toast.info .lucide{color:var(--neon)}
.toast b{display:block;font-size:.76rem}
.toast span{color:var(--muted);font-size:.7rem;display:block;margin-top:2px}

/* ---------- Info tiles & misc ---------- */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tile{background:rgba(3,7,18,.4);border:1px solid var(--line2);border-radius:11px;padding:11px 13px}
[data-theme="light"] .tile{background:rgba(243,246,251,.7)}
.tile small{display:block;font-size:.6rem;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:3px}
.tile b{font-size:.86rem;color:var(--text);font-weight:600;word-break:break-word}
.list-row{display:flex;align-items:flex-start;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.list-row:last-child{border-bottom:none}
.list-row .lucide{width:16px;height:16px;flex:0 0 16px;margin-top:2px}
.list-row .body{flex:1;min-width:0}
.list-row .body b{font-size:.78rem;display:block}
.list-row .body p{font-size:.7rem;color:var(--muted);margin-top:3px;line-height:1.5}
.list-row .meta{font-size:.62rem;color:var(--dim);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.68rem;color:var(--muted);line-height:1.55;border-left:3px solid var(--warn);background:rgba(255,176,32,.05);padding:8px 12px;border-radius:0 10px 10px 0;margin-top:10px}
.note.blue{border-left-color:var(--neon);background:rgba(0,212,255,.05)}
.note.red{border-left-color:var(--danger);background:rgba(255,59,92,.05)}

.disclaimer .lucide{width:14px;height:14px;flex:0 0 14px;color:var(--warn);margin-top:1px}
.tag3d{position:absolute;left:12px;bottom:10px;font-size:.6rem;color:var(--dim);letter-spacing:.06em;z-index:5}
.scene-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#020409;min-height:300px}
.scene-wrap canvas{display:block;width:100%!important;height:100%!important;touch-action:none}

.scene-hud .hud{pointer-events:auto;font-size:.62rem;font-weight:700;padding:4px 9px;border-radius:8px;background:rgba(3,7,18,.75);border:1px solid var(--line2);color:var(--muted);backdrop-filter:blur(4px);cursor:pointer;letter-spacing:.05em}
.scene-hud .hud.active,.scene-hud .hud:hover{color:var(--neon);border-color:var(--neon)}
.gaugebox{display:flex;flex-direction:column;align-items:center;gap:6px}
.gaugebox canvas{max-width:100%}

.gaugebox small{color:var(--dim);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.66rem;color:var(--muted);align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.crumbs{font-size:.66rem;color:var(--dim);letter-spacing:.06em}

.msg.bot .tag{font-size:.56rem;letter-spacing:.12em;color:var(--warn);display:block;margin-bottom:5px;text-transform:uppercase;font-weight:800}
.msg .copy-btn{margin-top:7px;font-size:.62rem;color:var(--dim);background:none;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}

.sugg{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px 10px}

.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.matrix5{display:grid;grid-template-columns:repeat(6,minmax(60px,1fr));gap:4px;font-size:.6rem}
.matrix5 .mcell{aspect-ratio:1.6;display:grid;place-items:center;border-radius:7px;font-weight:800;color:#0b1220;position:relative;min-height:34px}

.cal-day{min-height:74px;border:1px solid var(--line2);border-radius:9px;padding:6px;font-size:.68rem;position:relative;background:rgba(3,7,18,.35)}
[data-theme="light"] .cal-day{background:rgba(243,246,251,.7)}
.cal-day.off{opacity:.35}
.cal-day.today{border-color:var(--neon);box-shadow:0 0 10px rgba(0,212,255,.2) inset}
.cal-day .dnum{font-family:var(--fontHead);font-size:.72rem;color:var(--muted)}
.cal-ev{margin-top:4px;font-size:.58rem;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;border-radius:6px;padding:2px 5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev.meteor{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.3);color:#7dd3fc}
.tl-wrap{display:flex;gap:0;overflow-x:auto;padding:16px 4px 22px;position:relative}
.tl-wrap::before{content:"";position:absolute;left:0;right:0;top:38px;height:2px;background:linear-gradient(90deg,var(--neon),var(--cosmic))}
.tl-item{flex:0 0 150px;text-align:center;position:relative;padding:0 8px;cursor:pointer}
.tl-item .dot{width:14px;height:14px;margin:24px auto 10px;border-radius:50%;background:var(--neon);box-shadow:0 0 10px rgba(0,212,255,.8);border:3px solid var(--bg);position:relative;z-index:1}
.tl-item:hover .dot{background:var(--cosmic)}
.tl-item .yr{font-family:var(--fontHead);color:#7dd3fc;font-size:.8rem;font-weight:700}
.tl-item .tt{font-size:.64rem;color:var(--muted);margin-top:4px;line-height:1.4;word-break:break-word}
.waterfall-wrap{position:relative;height:300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#01040a}
.waterfall-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.kbd-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:.78rem}
.kbd-row kbd{background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:7px;padding:2px 9px;font-size:.7rem;font-family:ui-monospace,monospace;color:var(--neon)}
.palette-box{width:min(620px,94vw);margin-top:8vh;background:var(--glass);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);align-self:flex-start}
.palette-box input{width:100%;background:transparent;border:none;outline:none;color:var(--text);padding:16px 18px;font-size:1rem;border-bottom:1px solid var(--line2)}
.palette-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.pal-item .lucide,.pal-item .ic-fb{width:16px;height:16px}
.pal-item.sel,.pal-item:hover{background:rgba(0,212,255,.1);color:var(--text)}
.pal-item small{margin-left:auto;color:var(--dim);font-size:.62rem}
.risk-lv{font-weight:800;letter-spacing:.08em;font-size:.64rem;padding:3px 9px;border-radius:7px}
.rlv-low{background:rgba(0,230,118,.12);color:var(--ok)}
.rlv-mod{background:rgba(0,212,255,.12);color:var(--neon)}
.rlv-ele{background:rgba(255,176,32,.14);color:var(--warn)}
.rlv-high{background:rgba(249,115,22,.16);color:#fb923c}
.rlv-crit{background:rgba(255,59,92,.16);color:var(--danger)}
.org-card{display:flex;gap:11px;align-items:center;background:rgba(3,7,18,.4);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;transition:border .15s;cursor:default}
[data-theme="light"] .org-card{background:rgba(243,246,251,.7)}
.org-card:hover{border-color:var(--line)}
.org-card .abbr{font-family:var(--fontHead);font-weight:800;font-size:.9rem;color:var(--neon);flex:0 0 52px}
.org-card .n{font-size:.76rem;font-weight:600}
.org-card .d{font-size:.64rem;color:var(--dim);margin-top:2px}
.astra-head{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.astra-avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(139,92,246,.25));border:1px solid var(--line);position:relative;overflow:hidden}
.astra-avatar::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 70deg,rgba(139,92,246,.4) 100deg,transparent 130deg);animation:spin 5s linear infinite}
.astra-avatar .lucide{width:22px;height:22px;color:#c4b5fd;z-index:1}
.lb-scroll{max-height:340px;overflow-y:auto}
.footer-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line2);font-size:.62rem;color:var(--dim)}
.footer-bar .sep{width:1px;height:12px;background:var(--line2)}
.ticker{flex:1;min-width:200px;overflow:hidden;white-space:nowrap;position:relative}
.ticker span{display:inline-block;animation:tick 40s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff!important;color:#111!important}
  #app,#toastRoot,#paletteRoot,#starfield,.modal-ov{display:none!important}
  #printArea{display:block!important;padding:24px;font-size:11pt;color:#111}
  #printArea h1,#printArea h2,#printArea h3{color:#111!important;font-family:Georgia,serif}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea td,#printArea th{border:1px solid #999;padding:5px 8px;font-size:9pt}
  #printArea img{max-width:100%}
}
/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width:980px){
  #sidebar{transform:translateX(-105%);box-shadow:0 0 50px rgba(0,0,0,.6)}
  .app.side-open #sidebar{transform:translateX(0)}
  .main,.app.side-collapsed .main{margin-left:0}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}

}
@media (max-width:640px){
  html{font-size:14px}
  #view{padding:12px 10px 26px}
  #topbar{flex-wrap:wrap;height:auto;min-height:52px;padding:8px 10px;row-gap:7px}
  #topbar>.tb-btn{height:32px;min-width:32px}
  .gsearch{order:10;flex:1 1 100%}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .page-head h1{font-size:1rem}

  .tb-title{display:none}
  .chat-wrap{height:70vh}
  .form-row{grid-template-columns:1fr}
  .modal{max-height:92vh}
  .set-row select,.set-row input[type=number]{width:130px;flex-basis:130px}
}
</style>

<script>
'use strict';
/* ================================================================
   SPACE INTELLIGENCE SYSTEM (SIS) v2.2.1 — Single-file application
   All modules, demo data, 3D, charts, storage & optional Supabase sync.
   ================================================================ */

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmtN = (n,d=0) => (isFinite(n)?Number(n):0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtK = n => n>=1e9?fmtN(n/1e9,2)+' B' : n>=1e6?fmtN(n/1e6,2)+' jt' : n>=1e3?fmtN(n/1e3,1)+' rb' : fmtN(n);
const DEG = Math.PI/180;
function fmtDate(ts, style){
  if(!ts) return '—';
  const d = new Date(ts);
  if(isNaN(d)) return '—';
  const pad = x => String(x).padStart(2,'0');
  const df = style || (SET?.dateFormat || 'dd/mm/yyyy');
  const dd = pad(d.getDate()), mm = pad(d.getMonth()+1), yy = d.getFullYear();
  const dateStr = df==='mm/dd/yyyy' ? `${mm}/${dd}/${yy}` : df==='yyyy-mm-dd' ? `${yy}-${mm}-${dd}` : `${dd}/${mm}/${yy}`;
  return dateStr + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+' dtk lalu';
  if(s<3600) return Math.floor(s/60)+' mnt lalu';
  if(s<86400) return Math.floor(s/3600)+' jam lalu';
  return Math.floor(s/86400)+' hari lalu';
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function download(name, content, mime){
  const blob = new Blob([content],{type:mime||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);
}
/* quoted-aware CSV parser */
function parseCSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(inQ){
      if(c==='"'&&n==='"'){cur+='"';i++;}
      else if(c==='"'){inQ=false;}
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','&&n==='\r'){row.push(cur);cur='';i++;}
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c==='\r'){/*skip*/}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.length>1||(r[0]||'').trim()!=='');
}
function toCSV(rows){ // rows: array of arrays of primitives
  return rows.map(r=>r.map(v=>{
    v=String(v==null?'':v);
    return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }).join(',')).join('\r\n');
}

/* ---------------- SGP4 (Tahap 3): propagasi TLE nyata via satellite.js ---------------- */
const SGP4C={sats:{},tle:null,ts:0};
function applyTLE(data){
  try{
    const recs=(data||[]).filter(x=>x&&x.TLE_LINE1&&x.TLE_LINE2);
    SGP4C.tle={byNorad:{},n:recs.length};
    recs.forEach(x=>{ SGP4C.tle.byNorad[String(x.NORAD_CAT_ID)]={l1:x.TLE_LINE1,l2:x.TLE_LINE2,epoch:x.EPOCH||'',name:x.OBJECT_NAME||''}; });
    SGP4C.ts=Date.now();
    return recs.length;
  }catch(e){ return 0; }
}
function sgp4Ground(l1,l2,ts){
  try{
    if(!window.satellite||typeof window.satellite.twoline2satrec!=='function') return null;
    const key=String(l1).slice(9,17).trim();
    if(!SGP4C.sats[key]) SGP4C.sats[key]=window.satellite.twoline2satrec(l1,l2);
    const rec=SGP4C.sats[key];
    const d=new Date(ts);
    const pv=window.satellite.propagate(rec,d);
    if(!pv||!pv.position) return null;
    const gd=window.satellite.eciToGeodetic(pv.position,window.satellite.gstime(d));
    if(!gd||!Number.isFinite(gd.latitude)||!Number.isFinite(gd.longitude)||!Number.isFinite(gd.height)) return null;
    return {lat:gd.latitude*180/Math.PI,lon:(gd.longitude*180/Math.PI+540)%360-180,alt:Math.round(gd.height),src:'SGP4'};
  }catch(e){ return null; }
}
/* groundFor: posisi satelit — SGP4 nyata dari TLE CelesTrak bila tersedia;
   ISS fallback ke posisi live WhereTheISS.at; selain itu model demo sirkular */
function groundFor(sat,ts){
  const t=SGP4C.tle&&SGP4C.tle.byNorad&&SGP4C.tle.byNorad[String(sat&&sat.norad)];
  if(t){ const g=sgp4Ground(t.l1,t.l2,ts); if(g) return g; }
  if(sat&&String(sat.norad)==='25544'&&STATE.issNow&&typeof STATE.issNow.latitude==='number'){
    return {lat:STATE.issNow.latitude,lon:STATE.issNow.longitude,alt:Math.round(STATE.issNow.altitude),src:'LIVE API'};
  }
  return satGround(sat,ts);
}
/* ensureTLE: ambil TLE CelesTrak (dibatasi maks. 1x per 2 jam — etika rate-limit CelesTrak) */
async function ensureTLE(){
  if(SGP4C.tle&&Date.now()-SGP4C.ts<2*3600*1000) return true;
  const r=await fetchJSON('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json',{cacheKey:'celes_stations',timeout:10000});
  if(r.ok&&Array.isArray(r.data)){
    const n=applyTLE(r.data);
    STATE.celestrak=r.data;
    markSource('celesTrak','CelesTrak GP (TLE)',r.live?'LIVE':'CACHED','https://celestrak.org/NORAD/elements/gp.php');
    if(n) logAct('sgp4','TLE CelesTrak termuat ('+n+' objek) — propagasi SGP4 aktif');
    return true;
  }
  return false;
}
/* Posisi ISS nyata (sumber cadangan tanpa TLE, CORS terbuka) — api.wheretheiss.at */
async function fetchISSNow(){

  }
  return r;
}

const SUPA={client:null,status:'offline',lastError:''};
function supaLoadSdk(){
  return new Promise((res,reject)=>{
    if(window.supabase && window.supabase.createClient) return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
    s.onload=()=>window.supabase&&window.supabase.createClient?res():reject(new Error('SDK gagal dimuat'));
    s.onerror=()=>reject(new Error('CDN Supabase tidak dapat diakses (mode offline)'));
    document.head.appendChild(s);
  });
}
async function supaConnect(){
  const cfg=COLL.supaCfg;
  if(!cfg.url||!cfg.key) throw new Error('URL dan anon key Supabase belum diisi.');
  await supaLoadSdk();
  SUPA.client=window.supabase.createClient(cfg.url.replace(/\/+$/,''),cfg.key);
  const {error}=await SUPA.client.from(cfg.table||'sis_records').select('record_id').limit(1);
  if(error) {
    SUPA.status='error'; SUPA.lastError=error.message;
    const m=error.message||'';
    if(/permission denied/i.test(m)) throw new Error(m+' → GRANT tabel untuk anon tidak ada. Jalankan SQL lengkap dari tombol "Schema SQL" (blok GRANT) di SQL Editor project yang sama, lalu coba lagi.');
    if(/row-level security/i.test(m)) throw new Error(m+' → RLS aktif tanpa policy yang mengizinkan anon. Jalankan blok policy pada SQL "Schema SQL".');
    if(/does not exist|PGRST205|could not find/i.test(m)) throw new Error(m+' → tabel belum ada di project ini. Jalankan SQL "Schema SQL" pada project yang SAMA dengan URL di atas.');
    throw error;
  }
  SUPA.status='connected'; SUPA.lastError='';
  markSource('supabase','Supabase Cloud Sync','LIVE',cfg.url);
  logAct('supabase','Terhubung ke Supabase: '+cfg.url);
  // sinkronisasi pengaturan antar perangkat (v2.2.1): tarik snapshot koneksi/kunci, lalu kirim versi lokal
  try{
    const got=await supaSettingsPull();
    if(got) logAct('supabase','Pengaturan koneksi/kunci NASA ditarik dari cloud (antar perangkat).');
    await supaSettingsPush(!!(COLL.supaCfg&&COLL.supaCfg.syncKey&&SET.nasaKey));
  }catch(e){ /* non-fatal — sinkron pengaturan opsional */ }
  return true;
}
const SUPA_COLLECTIONS=['missions','alerts','notes','hypo','signals','calEvents','objects','reports'];
async function supaPush(){
  if(!SUPA.client) throw new Error('Belum terhubung ke Supabase.');
  const tbl=COLL.supaCfg.table||'sis_records';
  const rows=[];
  SUPA_COLLECTIONS.forEach(c=>{
    (COLL[c]||[]).forEach(r=>{ rows.push({collection:c,record_id:String(r.id||uid()),payload:r,updated_at:new Date().toISOString()}); });
  });
  if(!rows.length) return 0;
  const {error}=await SUPA.client.from(tbl).upsert(rows,{onConflict:'collection,record_id'});
  if(error) throw error;
  logAct('supabase','Push '+rows.length+' record ke cloud.');
  return rows.length;
}
async function supaPull(){
  if(!SUPA.client) throw new Error('Belum terhubung ke Supabase.');
  const tbl=COLL.supaCfg.table||'sis_records';
  const {data,error}=await SUPA.client.from(tbl).select('*').order('updated_at',{ascending:false}).limit(2000);
  if(error) throw error;
  let n=0;
  (data||[]).forEach(row=>{
    if(!SUPA_COLLECTIONS.includes(row.collection)) return;
    const arr=COLL[row.collection]; if(!Array.isArray(arr)) return;
    const i=arr.findIndex(x=>String(x.id)===String(row.record_id));
    if(i>=0){ if(!arr[i]._t||row.updated_at>arr[i]._t){arr[i]=row.payload;arr[i]._t=row.updated_at;n++;} }
    else { row.payload._t=row.updated_at; arr.push(row.payload); n++; }
  });
  SUPA_COLLECTIONS.forEach(c=>persist(c));
  logAct('supabase','Pull '+n+' record dari cloud.');
  return n;
}

/* ---------------- Sinkronisasi pengaturan antar perangkat (v2.2.1) ----------------
   Kredensial (URL + anon key + opsi kunci NASA) hidup di localStorage = per-device.
   Snapshot disimpan ke tabel api_cache (source='sis_settings') di project Supabase,
   sehingga perangkat lain yang Connect ke project yang SAMA otomatis menariknya. */
function supaSettingsPayload(includeKey){
  return {supaCfg:{url:COLL.supaCfg.url,key:COLL.supaCfg.key,table:COLL.supaCfg.table,auto:COLL.supaCfg.auto,proxy:COLL.supaCfg.proxy,syncKey:!!includeKey},
    nasaKey:includeKey?(SET.nasaKey||''):'', ver:'v2.2.1', ts:new Date().toISOString()};
}
async function supaSettingsPush(includeKey){
  if(!SUPA.client||!COLL.supaCfg.url) return false;
  const {error}=await SUPA.client.from('api_cache')
    .upsert({source:'sis_settings',payload:supaSettingsPayload(includeKey),fetched_at:new Date().toISOString()},{onConflict:'source'});
  if(error){ logAct('supabase','Push pengaturan gagal: '+error.message); return false; }
  logAct('supabase','Pengaturan dikirim ke cloud'+(includeKey?' (termasuk kunci NASA).':' (tanpa kunci NASA).'));
  return true;
}
async function supaSettingsPull(){
  if(!SUPA.client) return false;
  const {data,error}=await SUPA.client.from('api_cache').select('payload').eq('source','sis_settings').limit(1);
  if(error||!data||!data.length) return false;
  const p=data[0].payload||{}; let applied=0;
  if(p.supaCfg&&p.supaCfg.url&&p.supaCfg.key){
    COLL.supaCfg=Object.assign({},COLL.supaCfg,p.supaCfg); persist('supaCfg'); applied++;
  }
  if(p.nasaKey&&!SET.nasaKey){ SET.nasaKey=p.nasaKey; saveSet(); applied++; }
  return applied>0;
}

function jdFromDate(ts){
  const d=new Date(ts); let y=d.getUTCFullYear(),m=d.getUTCMonth()+1;
  const day=d.getUTCDate(),h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;

  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+B-1524.5+h/24;

/* helioKepler: posisi heliosentris ekliptik (AU) dari elemen Kepler —
   M diselesaikan dengan Newton (E−e·sinE=M), rotasi 3D standar */
function helioKepler(id,jd){
  const K=KEPL[id]; if(!K) return null;
  const T=(jd-2451545.0)/36525.0;
  const a=K[0]+K[6]*T, e=K[1]+K[7]*T, I=(K[2]+K[8]*T)*DEG;
  const L=K[3]+K[9]*T, wbar=K[4]+K[10]*T, O=(K[5]+K[11]*T)*DEG;
  const w=(wbar-K[5]-K[11]*T)*DEG;
  let M=((L-wbar)%360)*DEG;
  if(M>Math.PI)M-=6.283185307179586; if(M<-Math.PI)M+=6.283185307179586;
  let E=M;
  for(let i=0;i<10;i++){ const dE=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E)); E-=dE; if(Math.abs(dE)<1e-12)break; }
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(O),so=Math.sin(O),ci=Math.cos(I),si=Math.sin(I);
  const x=(cw*co-sw*so*ci)*xp+(-sw*co-cw*so*ci)*yp;
  const y=(cw*so+sw*co*ci)*xp+(-sw*so+cw*co*ci)*yp;
  const z=(sw*si)*xp+(cw*si)*yp;
  const r=Math.sqrt(x*x+y*y+z*z);
  return {x,y,z,r,lon:(Math.atan2(y,x)/DEG+360)%360,a,e};
}
/* ---------- Lapisan JPL Horizons (opsional; LIVE bila terjangkau) ---------- */
const HORIZ={ids:{mercury:199,venus:299,earth:399,mars:499,jupiter:599,saturn:699,uranus:799,neptune:899,pluto:999},vec:{},n:0,ts:0,probeN:0,probeTs:0};
function horizonsURL(naif){
  const t0=new Date(Date.now()-12*36e5).toISOString().slice(0,16).replace('T',' ');
  const t1=new Date(Date.now()+12*36e5).toISOString().slice(0,16).replace('T',' ');

    '&STEP_SIZE=%271h%27&QUANTITIES=%271,2%27&REF_PLANE=ECLIPTIC&OUT_UNITS=%27AU-D%27';

function parseHorizonsVectors(json){
  try{
    const res=String((json&&json.result)||'');
    const i=res.indexOf('$$SOE'), j=res.indexOf('$$EOE');
    if(i<0||j<0||j<=i) return null;
    const line=res.slice(i+5,j).trim().split('\n')[0];
    const nums=line.replace(/,/g,' ').trim().split(/\s+/).filter(s=>/^[+-]?(\d+\.?\d*|\.\d+)([Ee][+-]?\d+)?$/.test(s));
    if(nums.length<10) return null;
    const v=nums.slice(-9).map(Number);
    return {jd:Number(nums[nums.length-10]),x:v[0],y:v[1],z:v[2],vx:v[3],vy:v[4],vz:v[5]};

/* realtimePos: posisi badan pada JD — Horizons live bila ada, else Kepler */
function realtimePos(id,jd){
  const v=HORIZ.vec[id];
  if(v){
    const dt=jd-v.jd, x=v.x+v.vx*dt, y=v.y+v.vy*dt, z=v.z+v.vz*dt;
    const r=Math.sqrt(x*x+y*y+z*z)||1e-9;
    return {x,y,z,r,lon:(Math.atan2(y,x)/DEG+360)%360,live:true};
  }

  return k?{x:k.x,y:k.y,z:k.z,r:k.r,lon:k.lon,live:false}:null;

/* keplerScenePos: posisi scene (X,Z bidang ekliptika; Y=tinggi z) —
   negasi sin agar revolusi CCW tampak benar dari kutub utara ekliptika */
function keplerScenePos(id,jd){
  const p=realtimePos(id,jd); if(!p) return null;
  const R=AU_SCALE(p.r);
  return {x:Math.cos(p.lon/DEG)*R, y:R*(p.z/p.r), z:-Math.sin(p.lon/DEG)*R, live:!!p.live, rAU:p.r, lon:p.lon};

/* jalur orbit real (elips) untuk garis orbit scene */
function keplerOrbitScene(id){
  const K=KEPL[id]; if(!K||typeof THREE==='undefined') return null;
  const T=(jdFromDate(Date.now())-2451545.0)/36525.0;
  const a=K[0]+K[6]*T, e=K[1]+K[7]*T, I=(K[2]+K[8]*T)*DEG;
  const wbar=K[4]+K[10]*T, O=(K[5]+K[11]*T)*DEG, w=(wbar-K[5]-K[11]*T)*DEG;
  const cw=Math.cos(w),sw=Math.sin(w),co=Math.cos(O),so=Math.sin(O),ci=Math.cos(I),si=Math.sin(I);
  const pts=[];
  for(let i=0;i<128;i++){
    const E=i/128*6.283185307179586;
    const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
    const x=(cw*co-sw*so*ci)*xp+(-sw*co-cw*so*ci)*yp;
    const y=(cw*so+sw*co*ci)*xp+(-sw*so+cw*co*ci)*yp;
    const z=(sw*si)*xp+(cw*si)*yp;
    const r=Math.sqrt(x*x+y*y+z*z)||1e-9, lon=Math.atan2(y,x);
    const R=AU_SCALE(r);
    pts.push(new THREE.Vector3(Math.cos(lon)*R, R*z/r, -Math.sin(lon)*R));
  }
  return pts;
}

        return {t:c.startTime?Date.parse(c.startTime):Date.now(),v:(a&&a.speed)?a.speed:'—',
          width:(a&&a.type)?a.type:'—',dir:'DONKI NASA',note:'CME tercatat NASA DONKI',live:true}; }); donki=true;
    }
  }
  if(!flares.length&&flareCls) flares=[{cls:flareCls,peak:Date.now(),region:'GOES XRS (SWPC)',loc:'—',
    note:'Kelas maksimum 24 jam dari flux X-ray GOES nyata — bukan simulasi',live:true}];
  const w=weatherNowSim(); // basis: series ilustratif & nilai fallback deterministik
  const srcs={kp:'simulasi',wind:'simulasi',dens:'simulasi (tanpa endpoint publik)',bt:'simulasi',ss:'est. F10.7',f107:'simulasi',flare:'SIMULASI',cme:'simulasi (DONKI perlu kunci NASA)'};
  if(kp!=null){ w.kp=Math.round(kp*10)/10; srcs.kp='LIVE NOAA'; }
  if(windV!=null){ w.wind=Math.round(windV); srcs.wind='LIVE DSCOVR'; }
  if(btV!=null){ w.bt=Math.round(btV*10)/10; srcs.bt='LIVE DSCOVR'; }
  if(f107V!=null){ w.f107=Math.round(f107V); srcs.f107='LIVE NOAA'; srcs.ss='est. dari F10.7 '+w.f107; }
  // densitas: tanpa endpoint realtime publik → model deterministik berlabel simulasi
  w.dens=Math.round((3+Math.abs(Math.sin(Date.now()/36e5*7.1))*5)*10)/10;
  w.ss=Math.max(0,Math.round((w.f107-70)/0.79)); // proxy SSN ≈ (F10.7−70)/0.79 — estimasi
  w.bz=bzV!=null?Math.round(bzV*10)/10:(w.bt?-w.bt*.3:w.bz);
  if(bzV!=null) srcs.bt='LIVE DSCOVR';
  if(flares.length){ w.flares=flares; srcs.flare=donki?'LIVE DONKI':'LIVE GOES XRS'; }
  if(cmes.length){ w.cmes=cmes; srcs.cme=donki?'LIVE DONKI':'—'; }
  w.rad=flareCls?(flareCls[0]==='X'?'S2 — Moderate (est.)':flareCls[0]==='M'?'S1 — Minor (est.)':'S0 — Tidak ada'):'S1 — Minor';
  w.rbn=flareCls?(flareCls[0]==='X'?'R3 — Strong':flareCls[0]==='M'?'R2 — Moderate':'R0 — Tidak ada'):'R1 — Minor (aktif)';
  w.auroraLat=52+Math.round(w.kp*3.2);
  // series 48 jam: Kp nyata per 3 jam (NOAA); wind/dens di chart bersifat ilustratif
  if(kpN&&kpN.length>2){
    w.series=kpN.slice(-16).map((r,i)=>({h:i,kp:Math.round(r.v*10)/10,
      wind:Math.round(340+Math.sin(i*.35)*120),dens:Math.round((3+Math.abs(Math.sin(i*.5))*5)*10)/10}));
    srcs.series='Kp nyata NOAA (3 jam per titik)';
  }
  w._srcs=srcs; w._live=srcs.kp==='LIVE NOAA'||srcs.wind==='LIVE DSCOVR'||srcs.flare.indexOf('LIVE')===0;
  STATE.swLive={w,ts:Date.now()};
  markSource('dscovr','NOAA SWPC — DSCOVR & GOES (angin, Bt/Bz, F10.7, flare)',
    w._live?((kpLive||rW.live||rX.live)?'LIVE':'CACHED'):'SIMULATED',
    'https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json');
  if(w._live) logAct('swpc','Cuaca antariksa nyata: angin '+w.wind+' km/s · Bt '+w.bt+' nT · Bz '+w.bz+' nT · F10.7 '+w.f107+' sfu · flare maks '+w.flares[0].cls);
  await refreshSWPCAlerts();
  return w._live?1:0;
}

/* ---------- Alert resmi NOAA SWPC (products/alerts.json — CORS terbuka) ----------
   Feed peringatan resmi: X-ray Event exceeded (flare), geomagnetic
   warning/watch, radio blackout (R-scale), dsb. 30 hari terakhir, 10 terbaru.
   Catatan skema: issue_datetime = 'YYYY-MM-DD HH:MM:SS.mmm' UTC (bukan ISO 8601)
   dan message berisi header CRLF — sisihkan baris Serial/Issue Time. */
async function refreshSWPCAlerts(){
  const r=await fetchJSON('https://services.swpc.noaa.gov/products/alerts.json',{cacheKey:'swpc_alerts2',timeout:12000});
  const ok=r.ok&&Array.isArray(r.data);
  const now=Date.now();
  STATE.swpcAlerts=ok?{st:r.live?'LIVE':'CACHED',ts:now,list:r.data
    .map(a=>{
      const t=Date.parse(String(a.issue_datetime||'').replace(' ','T')+'Z');
      const lines=String(a.message||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const msg=lines.filter(l=>!/^Space Weather Message Code:|^Serial Number:|^Issue Time:/i.test(l))
        .slice(0,2).join(' · ')||lines[0]||'—';
      return {pid:String(a.product_id||'—'),t,msg,sub:((a.message||'').match(/^Issue Time: (.+)$/m)||[])[1]||''};
    })
    .filter(a=>isFinite(a.t)&&now-a.t<30*864e5)
    .sort((a,b)=>b.t-a.t)
    .slice(0,10)}:null;
  markSource('swpcAlerts','NOAA SWPC — alert resmi (products/alerts.json)',ok?(r.live?'LIVE':'CACHED'):'UNAVAILABLE','https://services.swpc.noaa.gov/products/alerts.json');
  if(ok&&STATE.swpcAlerts.list.length) logAct('swpc','Alert resmi NOAA termuat: '+STATE.swpcAlerts.list.length+' (30 hari terakhir)');
  return ok;
}

/* ---------- Peringatan nyata gabungan (turunan feed LIVE — tanpa request baru) ----------
   Menggabungkan alert resmi NOAA SWPC (STATE.swpcAlerts) + gempa M≥6 USGS
   (STATE.usgsEvs) untuk panel "Peringatan Terbaru" & "Kotak Peringatan". */
function realAlerts(){
  const out=[];
  ((STATE.swpcAlerts||{}).list||[]).slice(0,6).forEach(a=>{
    const m=String(a.msg||'').toUpperCase();
    out.push({title:'NOAA SWPC '+a.pid+(a.sub?' — '+a.sub:''),msg:a.msg,ts:a.t,
      prio:/K-INDEX OF [5-9]|X-RAY EVENT EXCEEDED X|PROTON|S[3-5]|R[3-5]|EXTREME/.test(m)?'High':
        /ALERT|WARNING|WATCH|SUMMARY/.test(m)?'Medium':'Low',sim:false,src:'NOAA SWPC'});
  });
  (STATE.usgsEvs||[]).forEach(e=>{
    const mg=parseFloat(String(e.n||'').match(/^M(\d+\.?\d*)/)||[0,0]);
    if(mg>=6.0) out.push({title:'Gempa '+e.n,msg:e.note+' Data USGS real-time (M≥6, 7 hari terakhir).',ts:Date.now(),prio:mg>=6.5?'High':'Medium',sim:false,src:'USGS'});
  });
  return out.sort((a,b)=>b.ts-a.ts);
}

   (terverifikasi 200 + CORS terbuka, ±95 event/minggu) sebagai sumber LIVE utama. */
async function refreshEONET(){
  const r=await fetchJSON('https://eonet.gsfc.nasa.gov/api/v3/events?limit=12',{cacheKey:'eonet',timeout:12000});
  if(r.ok&&r.data&&Array.isArray(r.data.events)){
    STATE.eonetEvs=r.data.events.map(eonetMarker).filter(Boolean);
    STATE.eonetSt=r.live?'LIVE':'CACHED';
    markSource('eonet','NASA EONET — event geofisika',STATE.eonetSt,'https://eonet.gsfc.nasa.gov/api/v3/events');
  } else { STATE.eonetEvs=[]; STATE.eonetSt='UNAVAILABLE'; markSource('eonet','NASA EONET — event geofisika','UNAVAILABLE','https://eonet.gsfc.nasa.gov/api/v3/events'); }
  updateEarthBadge();
  return STATE.eonetSt!=='UNAVAILABLE';
}
async function refreshUSGS(){
  const r=await fetchJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson',{cacheKey:'usgs45',timeout:12000});
  STATE.usgsEvs=(r.ok&&Array.isArray(r.data.features))?r.data.features.map(usgsMarker).filter(Boolean):[];
  STATE.usgsSt=STATE.usgsEvs.length?(r.live?'LIVE':'CACHED'):'UNAVAILABLE';
  markSource('usgs','USGS — gempa M4.5+ global',STATE.usgsSt,'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson');
  updateEarthBadge();
  return STATE.usgsSt!=='UNAVAILABLE';
}
async function fetchEarthEvents(){ return Promise.all([refreshEONET(),refreshUSGS()]); }
function eonetCat(c){
  c=String(c||'');
  if(/wildfire/i.test(c)) return ['kebakaran','#ffb020','flame'];
  if(/volcan/i.test(c)) return ['vulkan','#ff6b35','mountain'];
  if(/ice/i.test(c)) return ['kutub','#7dd3fc','snowflake'];
  if(/storm/i.test(c)) return ['badai','#a78bfa','wind'];
  if(/flood/i.test(c)) return ['laut','#00d4ff','waves'];
  if(/drought|dust|smoke|landslide/i.test(c)) return ['vegetasi','#00e676','leaf'];
  return ['lainnya','#7dd3fc','orbit'];
}
function eonetMarker(e){
  const g=e.geometry||[],last=g[g.length-1],co=last&&last.coordinates;
  let lon=null,lat=null;
  if(Array.isArray(co)&&typeof co[0]==='number'){ lon=co[0]; lat=co[1]; }
  else if(Array.isArray(co)&&Array.isArray(co[0])){ lon=co[0][0][0]; lat=co[0][0][1]; }
  if(lon==null||lat==null||!isFinite(lat)||!isFinite(lon)) return null;
  const cat=(e.categories&&e.categories[0]&&e.categories[0].title)||'—', ct=eonetCat(cat);
  return {n:String(e.title||'Event'),type:ct[0],lat,lon,color:ct[1],icon:ct[2],
    note:'Event aktif NASA EONET — kategori: '+cat+'.',link:e.link,real:true};
}
function usgsMarker(f){
  const p=f.properties,c=f.geometry&&f.geometry.coordinates;
  if(!p||!c||p.mag==null||!isFinite(c[1])) return null;
  return {n:'M'+(+p.mag).toFixed(1)+' — '+String(p.place||'lokasi tidak diketahui'),type:'gempa',lat:c[1],lon:c[0],
    color:p.mag>=6?'#ff3b5c':p.mag>=5?'#f97316':'#ffb020',icon:'activity',
    note:'Gempa M'+(+p.mag).toFixed(1)+', kedalaman '+Math.round(c[2])+' km — USGS real-time.',link:p.url,real:true};
}
function liveEarthMarkers(){ return [].concat(STATE.eonetEvs||[],STATE.usgsEvs||[]); }
function updateEarthBadge(){
  const b=document.getElementById('eoLiveBadge'); if(!b) return;
  const parts=[];
  parts.push('EONET: '+(STATE.eonetEvs&&STATE.eonetEvs.length?(STATE.eonetSt+' ('+STATE.eonetEvs.length+' event)'):STATE.eonetSt||'—'));
  parts.push('USGS: '+(STATE.usgsEvs&&STATE.usgsEvs.length?(STATE.usgsSt+' ('+STATE.usgsEvs.length+' gempa)'):STATE.usgsSt||'—'));
  const ok=(STATE.eonetEvs&&STATE.eonetEvs.length)||(STATE.usgsEvs&&STATE.usgsEvs.length);
  b.className='badge '+(ok?'b-live':'b-sim');
  b.textContent=parts.join(' · ');
}

/* Generator keadaan cuaca antariksa demo (deterministik per jam).
   weatherNow() memilih data LIVE (STATE.swLive — NOAA SWPC DSCOVR/GOES, lihat 04b)
   dan hanya jatuh ke generator ini bila fetch gagal (label SIMULATED). */
function weatherNowSim(){
  const hr=Math.floor(Date.now()/36e5);
  const s=(n)=>{ const x=Math.sin(hr*n)*.5+.5; return x; };
  const kp=Math.round((s(1.7)*4+ s(4.3)*3)*10)/10; // 0..7 range realism
  const wind=Math.round(340+ s(2.9)*180 + s(5.7)*60);
  const dens=Math.round((3+ s(7.1)*6)*10)/10;
  const bt=Math.round((4+ s(3.3)*9)*10)/10;
  const bz=Math.round((-6+ s(9.2)*12)*10)/10;
  const ss=Math.round(80+ s(1.1)*90);
  const f107=Math.round(120+ s(2.2)*70);
  const flares=[
    {cls:'C2.4',peak:Date.now()-3.5*36e5,region:'AR3842',loc:'N12W34',note:'Simulasi — flare kecil kelas C'},
    {cls:'B7.1',peak:Date.now()-9*36e5,region:'AR3839',loc:'S08E21',note:'Simulasi — aktivitas rendah'},
    {cls:'M1.2',peak:Date.now()-31*36e5,region:'AR3842',loc:'N11W40',note:'Simulasi — flare kelas M dengan CME terkait'}
  ];
  const cmes=[{t:Date.now()-30*36e5,v:940,width:'halo (penuh)',dir:'arah Bumi (moderat)',note:'Simulasi — CME terkait M1.2'}];
  return {kp,wind,dens,bt,bz,ss,f107,flares,cmes,
    rad:'S1 — Minor', rbn:'R1 — Minor (pemudaran radio gelap) aktif',
    auroraLat: 52 + Math.round(kp*3.2),
    series: Array.from({length:48},(_,i)=>({h:i,kp:Math.round((Math.sin(hr*.4+i*.2)*2+3.5)*10)/10,wind:Math.round(340+Math.sin(hr*.3+i*.35)*120),dens:Math.round((3+Math.abs(Math.sin(hr*.2+i*.5))*5)*10)/10}))
  };
}
function kpStatus(kp){ return kp<2?['Normal','ok']:kp<4?['Minor','ok']:kp<5?['Moderate','warn']:kp<6?['Strong','warn']:kp<8?['Severe','bad']:['Extreme','bad']; }
/* weatherNow: data nyata NOAA SWPC bila tersedia, else generator simulasi */
function weatherNow(){
  const lv=(typeof STATE!=='undefined')&&STATE.swLive&&STATE.swLive.w;
  return lv?STATE.swLive.w:weatherNowSim();
}

const ASTRA_KB=[
 {k:['halo','hai','hi','hello','selamat','salam','permisi'],a:'Halo, Operator. Aku A.S.T.R.A. — Advanced Space Technology and Research Assistant (mode demonstrasi). Tanyakan apa saja tentang luar angkasa, atau gunakan pertanyaan yang disarankan di bawah.'},
 {k:['apa itu sis','space intelligence system','tentang aplikasi'],a:'SPACE INTELLIGENCE SYSTEM (SIS) adalah pusat komando intelijen luar angkasa berbasis web: 19 modul mencakup pemantauan satelit, NEO, cuaca antariksa, eksoplanet, SETI, hingga manajemen misi. Data demo tersimpan di LocalStorage dan bisa disinkronkan opsional ke Supabase dari modul Data Management.'},
 {k:['black hole','lubang hitam','sagittarius','m87'],a:'Black hole adalah wilayah dengan gravitasi begitu kuat sehingga tidak ada apa pun — termasuk cahaya — yang lolos setelah melewati event horizon. Contoh nyata di katalog SIS: Sagittarius A* (4,15 juta massa matahari, pusat Bima Sakti, difoto EHT 2022) dan M87* (6,5 miliar massa matahari, difoto EHT 2019). Mereka terdeteksi lewat efek gravitasi pada gas dan bintang di sekitarnya.'},
 {k:['supernova','betelgeuse','1987a'],a:'Supernova adalah ledakan bintang masif di akhir hidupnya (core-collapse) atau ledakan katai putih (Type Ia). SN 1987A di Awan Magellan Besar (1987) adalah supernova terdekat era modern. Betelgeuse adalah kandidat supernova masa depan, tetapi pada jarak ±548 tahun cahaya tidak berbahaya bagi Bumi — dan tidak diperkirakan meledak dalam waktu dekat.'},
 {k:['pulsar','neutron star','bintang neutron'],a:'Bintang neutron adalah inti bintang yang runtuh dengan diameter ±20 km namun massa lebih besar dari matahari. Pulsar adalah bintang neutron berputar cepat yang memancarkan berkas radio — contoh: Vela Pulsar (berputar 11,2×/detik) dan PSR B1919+21, pulsar pertama yang ditemukan tahun 1967.'},
 {k:['cuaca antariksa','space weather','flare','cme','solar wind','angin matahari'],a:'Cuaca antariksa mencakup flare (kilatan radiasi), CME (letupan plasma miliaran ton), dan angin matahari. Dampaknya: gangguan GPS/radio HF, korosi satelit, hingga listrik di jaringan transmisi. Buka modul Space Weather Intelligence untuk melihat indikator Kp, kecepatan angin matahari, dan prakiraan aurora di SIS. SIS menyediakan data simulasi dan mencoba sumber NOAA SWPC bila daring.'},
 {k:['kp index','kp'],a:'Kp Index (0–9) mengukur gangguan medan magnet global yang disebabkan angin matahari, diperbarui tiap 3 jam. Kp 0–2 normal; 3–4 minor/moderate; 5 storm kuat (G1); 6→G2; 7→G3; 8→G4; 9→G5. Kp ≥5 biasanya membuat aurora tampak lebih ke arah khatulistiwa.'},
 {k:['aurora'],a:'Aurora muncul ketika partikel bermuatan dari matahari memasuki magnetosfer dan menabrak atom atmosfer di ketinggian 100–300 km — oksigen memancarkan hijau/merah, nitrogen biru/ungu. Intensitas aurora naik saat Kp tinggi. Modul Space Weather SIS menampilkan prakiraan lintas aurora.'},
 {k:['satelit','satellite','orbit satelit'],a:'Satelit mengorbit Bumi di berbagai klasifikasi orbit: LEO (160–2.000 km — ISS, Starlink), MEO (±20.000 km — GPS/Galileo), GEO (35.786 km — tampak diam relatif terhadap Bumi), HEO (elips tinggi), Polar/SSO (lintasan kutub, cocok untuk observasi Bumi karena bumi selalu terliti matahari). Ada ±8.000 satelit aktif dan puluhan ribu objek dilacak. Data SIS: buka modul Satellite Intelligence.'},
 {k:['leo','meo','geo orbit'],a:'LEO: 160–2.000 km, orbit cepat (±90 menit) — stasiun ruang angkasa & konstelasi broadband. MEO: ±20.000 km, 12 jam — navigasi. GEO: 35.786 km, 24 jam, tetap di atas satu titik — komunikasi & cuaca. SSO: orbit kutub sinkron-matahari untuk pemantauan Bumi konsisten.'},
 {k:['space debris','sampah antariksa','keppler debris','debris'],a:'Sampah antariksa mencakup satelit mati, stage roket, dan fragmen tabrakan — lebih dari 30.000 objek besar dilacak, jutaan fragmen kecil. Kecil sekalipun (1 cm) berbahaya karena kecepatan ±10 km/detik. Kasus penting: tabrakan Iridium 33 × Cosmos 2251 (2009) dan uji anti-satelit yang memicu fragmen. Mitigasi: deorbit pasca-misi, maneuver conjunction, desain passivation.'},
 {k:['asteroid','neo','near earth object','apotentially hazardous'],a:'Near-Earth Object (NEO) adalah asteroid/komet yang orbitnya mendekati Bumi. "Potentially Hazardous Asteroid" (PHA) berarti orbitnya berpotensi mendekat berbahaya — bukan berarti akan menabrak. NASA CNEOS melacak ±34.000 NEO; tidak ada objek besar dengan probabilitas tumbukan signifikan dalam dekade mendatang. Di SIS, buka Asteroid & NEO Monitoring — probabilitas yang tampil hanya dari publikasi resmi; sisanya simulasi.'},
 {k:['apophis'],a:'99942 Apophis (diameter ±340 m) sempat dicemaskan pada 2004, kini dikecualikan NASA JPL sebagai ancaman setelah observasi 2021. Pada 13 April 2029 ia akan melewati hanya ±31.600 km dari Bumi — terlihat dengan mata telanjang — TANPA menabrak. Contoh bagus bagaimana kalkulasi orbit memperbaiki estimasi risiko.'},
 {k:['bennu'],a:'101955 Bennu (±490 m) adalah asteroid PHA yang diambil sampelnya oleh OSIRIS-REx (2020, sampel tiba 2023). Analisis orbitnya memberi probabilitas kumulatif tumbukan 0,057% antara 2175–2196 — sangat kecil, namun dipantau serius. NASA akan menilai ulang setelah efek Yarkovsky terukur.'},
 {k:['dart','defleksi asteroid'],a:'DART (NASA, 2022) adalah uji defleksi pertama: tabrakan sengaja ke Dimorphos (satelit asteroid Didymos) berhasil memperpendek periodenya ±32 menit — membuktikan strategi kinetic impactor. Tujuannya kesiapan planetary defense, bukan panik: tidak ada ancaman nyata saat ini.'},
 {k:['eksoplanet','exoplanet','planet luar tata surya','habitable','layak huni'],a:'Eksoplanet adalah planet di luar tata surya — terkonfirmasi ±5.800 (NASA Exoplanet Archive). Metode: transit (kecikan cahaya), radial velocity (goyangan bintang), imaging langsung, timing, microlensing. Penting: berada di "habitable zone" hanya berarti suhu memungkinkan air cair — TIDAK berarti ada kehidupan. Contoh menarik: TRAPPIST-1 e/d/f/g, TOI-700 d/e, K2-18b (CH₄ & CO₂ terdeteksi JWST).'},
 {k:['trappist'],a:'TRAPPIST-1 adalah bintang katai merah ultra-dingin (±40 tahun cahaya) dengan 7 planet batuan berukuran mirip Bumi; 3 di antaranya berada di habitable zone. Ini sistem paling banyak diamati JWST untuk karakterisasi atmosfer — hasil awal menunjukkan beberapa planet mungkin tidak memiliki atmosfer tebal. Riset masih berjalan.'},
 {k:['seti','sinyal','wow signal','sinyal radio','alien'],a:'SETI mencari sinyal teknosignature buatan: narrowband, drift tak biasa, sumber bergerak dengan langit. Tantangan: interferensi terestrial (RFI) dan satelit sangat mirip. Wow! Signal (1977) tetap tak terjelaskan namun tak pernah terdeteksi ulang; BLC1 (Proxima, 2019) kemungkinan besar RFI. Kandidat apapun harus melewati rule-out sebelum diklaim — dan belum ada kandidat yang lolos. Modul SETI SIS sepenuhnya simulasi.'},
 {k:['teleskop','jwst','hubble','james webb'],a:'JWST (teleskop inframerah 6,5 m, di L2 sejak 2022) melihat galaksi paling awal, atmosfer eksoplanet, dan bintang muda; Hubble (2,4 m optik, di LEO sejak 1990) tetap produktif untuk citra visual & UV. Bedanya: inframerah menembus debu dan menangkap cahaya yang "merah" karena perluasan alam semesta. L2 memberi matahari & Bumi di arah yang sama — penting untuk perisai panas JWST.'},
 {k:['matahari','sun','siklus matahari','sunspot','bintang matahari'],a:'Matahari: bintang G2V, usia ±4,6 miliar tahun, 99,86% massa tata surya. Energinya dari fusi hidrogen→helium di inti (15 juta °C). Aktivitas berpola ±11 tahun (minimum→maksimum) — saat maksimum, sunspot, flare, dan CME meningkat. Saat ini siklus 25 berjalan menuju puncak sekitar 2024–2026, sesuai prediksi NOAA.'},
 {k:['bulan','moon','apollo','artemis'],a:'Bulan: 3.475 km diameter, menguncikan rotasinya (sisi sama selalu menghadap Bumi), memicu pasang-surut, menjauh 3,8 cm/tahun. Apollo 11 (1969) — 12 astronot total mendarat. Program baru Artemis bertahap: Artemis II (flyby berawak, target 2026) lalu Artemis III (pendaratan selatan kutub). Chang\'e 6 (2024) membawa sampel pertama dari sisi jauh Bulan.'},
 {k:['mars','planet merah'],a:'Mars: diameter 6.779 km, atmosfer CO₂ tipis (0,6% tekanan Bumi), suhu −63 °C rata-rata. Buktinya pernah ada air: lembah sungai, delta, mineral hidrat. Saat ini dikunjungi Curiosity & Perseverance (NASA), Zhurong (CNSA, selesai) + orbiter regional & global. Target jangka panjang: sampel kembali ke Bumi (Mars Sample Return) dan kelayakan habitat berawak.'},
 {k:['venus'],a:'Venus: planet terpanas (464 °C) akibat efek rumah kaca CO₂ ekstrem, tekanan 92× Bumi, berotasi retrograde (Matahari terbit dari barat). Awan asam sulfatnya memantulkan cahaya sehingga tampak terang. Misi masa depan: VERITAS & DAVINCI (NASA), EnVision (ESA).'},
 {k:['jupiter'],a:'Jupiter: raksasa gas terbesar (11× diameter Bumi), hari terpendek (9,9 jam), medan magnet terkuat, ±95 bulan termasuk Europa (samudra bawah es) dan Ganymede (bulan terbesar). Great Red Spot = badai ratusan tahun. Sedang dikunjungi Juno; Europa Clipper dan JUICE (ESA) menuju sistemnya.'},
 {k:['saturnus','cincin saturnus'],a:'Saturnus terkenal cincin es & debunya (lebar ratusan ribu km, tebal biasanya <1 km). Massa jenis rendah (0,69 g/cm³). Bulan Titan punya atmosfer nitrogen tebal & danau metana; Enceladus menyemburkan geiser — kandidat kehidupan. Cassini (2004–2017) menyediakan data monumental.'},
 {k:['uranus','neptunus'],a:'Uranus: miring 98°, warna pucat karena metana, terdingin tercatat (−224 °C). Neptunus: angin tercepat (2.100 km/jam), ditemukan lewat perhitungan (1846). Keduanya hanya pernah dikunjungi Voyager 2 (1986 & 1989). NASA sedang memprioritaskan misi flagship Uranus (Uranus Orbiter and Probe).'},
 {k:['pluto','planet kerdil','kuiper'],a:'Pluto: planet kerdil di Sabuk Kuiper, diameternya 2.377 km, dengan jantung es nitrogen (Tombaugh Regio). Diklasifikasi ulang 2006 karena bertemu definisi planet IAU — ia belum "membersihkan" orbitnya. New Horizons (2015) mengungkap permukaannya yang mengejutkan aktif. Sabuk Kuiper menyimpan fosili tata surya.'},
 {k:['galaksi','bima sakti','milky way','andromeda'],a:'Bima Sakti: galaksi spiral berpalang ±100.000 tahun cahaya, ±100–400 miliar bintang, pusatnya Sagittarius A*. Andromeda (M31) adalah galaksi besar terdekat (2,5 juta tahun cahaya) dan akan bergabung dengan Bima Sakti ±4,5 miliar tahun lagi menjadi "Milkdromeda".'},
 {k:['nebula','nebulae'],a:'Nebula adalah awan gas & debu antarbintang. Nebula emisi (Orion M42) memancarkan cahaya karena ionisasi bintang muda; planetary nebula (Ring M57) adalah lapisan bintang mati; dark nebula menyembunyikan bintang yang sedang terbentuk. Pillars of Creation di Eagle Nebula (M16) difoto ulang oleh JWST 2022.'},
 {k:['gelombang gravitasi','gravitational wave','ligo'],a:'Gelombang gravitasi adalah riak ruang-waktu dari peristiwa masif (penggabungan black hole/neutron star). LIGO pertama mendeteksi GW150914 (2015, gabungan dua black hole 1,3 miliar tahun cahaya). GW170817 (2017) memicu era multi-pesan: gelombang gravitasi + gamma + kilonova. Detektor: LIGO, Virgo, KAGRA.'},
 {k:['redshift','perluasan alam semesta','big bang','usia alam semesta'],a:'Alam semesta berusia ±13,8 miliar tahun, mengembang sejak Big Bang. Perluasannya diukur via redshift cahaya galaksi; laju ekspansi (Hubble constant) ±70 km/s/Mpc — ada ketegangan pengukuran antara metode lokal & CMB. CMB (radiasi kosmik latar) adalah "bekas cahaya" era awal.'},

function astraAnswer(q){
  const ql=q.toLowerCase();
  let best=null,score=0;
  ASTRA_KB.forEach(e=>{
    let s=0;
    e.k.forEach(w=>{ if(ql.includes(w)) s+=w.length>5?3:2; });
    if(s>score){score=s;best=e;}
  });
  if(score>=2&&best) return best.a;
  // dynamic data answers
  if(/jumlah satelit|berapa satelit/.test(ql)){
    const op=SATS.filter(s=>s.status==='Operational').length;
    return `Berdasarkan dataset demo SIS: ${SATS.length} objek satelit/objek buatan terkatalog, ${op} berstatus operational, dan ${SATS.filter(s=>s.status==='Operational'&&s.cat==='Space Debris').length||0} contoh debris. Jumlah aktual di orbit (dilacak publik): ±8.000 satelit aktif dan >30.000 objek besar. Semua angka demo ditandai SIMULATED.`;
  }
  if(/risiko tertinggi|ancaman terbesar/.test(ql)){
    const top=RISKS.slice().sort((a,b)=>b.prob*b.imp-a.prob*a.imp)[0];
    return `Dalam skema risiko demo SIS, kombinasi probabilitas × dampak tertinggi ada di "${top.cat}" (base level ${top.base}). Ingat: skor ini simulasi edukatif — penilaian operasional harus memakai publikasi resmi (NASA CNEOS, NOAA SWPC, ESA).`;
  }
  if(/cuaca antariksa|kpk? hari ini|kondisi matahari/.test(ql)){
    const w=weatherNow(), st=kpStatus(w.kp);
    return `Keadaan cuaca antariksa (simulasi terbaru): Kp ${w.kp} (${st[0]}), angin matahari ${w.wind} km/s, densitas ${w.dens} p/cm³, Bt ${w.bt} nT, Bz ${w.bz} nT, sunspot ${w.ss}. Flare terakhir: ${w.flares[0].cls}. Lihat modul Space Weather Intelligence untuk grafik & prakiraan.`;
  }
  return null;
}

/* ---------- Starfield background (Canvas 2D) ---------- */
const STARFIELD={cv:null,ctx:null,stars:[],raf:null,shoot:[]};
function initStarfield(){
  const cv=$('#starfield'); if(!cv) return;
  STARFIELD.cv=cv; STARFIELD.ctx=cv.getContext('2d');
  const build=()=>{
    const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5);
    cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px';
    const n = SET.anim ? (SET.quality==='high'?Math.round(w*h/9000):SET.quality==='medium'?Math.round(w*h/14000):Math.round(w*h/22000)) : Math.round(w*h/30000);
    STARFIELD.stars=Array.from({length:clamp(n,60,650)},()=>({
      x:Math.random()*w,y:Math.random()*h,r:rand(.4,1.6),tw:rand(0,6.28),
      sp:SET.anim?rand(2,12):0,hue:Math.random()<.85?'255,255,255':(Math.random()<.5?'125,211,252':'196,181,253')
    }));
    ctxScale(cv,dpr);
  };
  function ctxScale(cv,dpr){ const c=STARFIELD.ctx; c.setTransform(dpr,0,0,dpr,0,0); }
  build(); addEventListener('resize',debounce(build,300));
  const loop=()=>{
    const c=STARFIELD.ctx, w=innerWidth,h=innerHeight;
    if(!c){STARFIELD.raf=requestAnimationFrame(loop);return;}
    if(document.documentElement.dataset.theme!=='light'){ c.clearRect(0,0,w,h);
      STARFIELD.stars.forEach(s=>{
        s.tw+=.02; if(SET.anim){ s.y+=s.sp/60; if(s.y>h) s.y=-4; }
        const a=.35+.5*Math.abs(Math.sin(s.tw));
        c.beginPath(); c.arc(s.x,s.y,s.r,0,6.283);
        c.fillStyle=`rgba(${s.hue},${a})`; c.fill();
      });
      if(SET.anim && Math.random()<.004){ STARFIELD.shoot.push({x:rand(0,w),y:rand(0,h*.5),vx:rand(3,7),vy:rand(1,3),life:1}); }
      STARFIELD.shoot=STARFIELD.shoot.filter(sh=>{
        sh.x+=sh.vx; sh.y+=sh.vy; sh.life-=.02;
        c.strokeStyle=`rgba(125,211,252,${sh.life})`; c.lineWidth=1.4;
        c.beginPath(); c.moveTo(sh.x,sh.y); c.lineTo(sh.x-sh.vx*6,sh.y-sh.vy*6); c.stroke();
        return sh.life>0;
      });
    } else c.clearRect(0,0,w,h);
    STARFIELD.raf=requestAnimationFrame(loop);
  };
  loop();
}

/* ---------- Membantu peta dunia 2D (equirectangular) ---------- */
function projectMap(lon,lat,W,H){
  return { x:(lon+180)/360*W, y:(90-lat)/180*H };
}
function drawWorldMap(ctx,W,H,opts){
  opts=opts||{};
  ctx.fillStyle=opts.bg||'rgba(2,8,20,.9)'; ctx.fillRect(0,0,W,H);
  if(!opts.hideGrid){
    ctx.strokeStyle='rgba(0,212,255,.12)'; ctx.lineWidth=1;
    for(let i=-150;i<=150;i+=30){ const p=projectMap(i,0,W,H); ctx.beginPath(); ctx.moveTo(p.x,0); ctx.lineTo(p.x,H); ctx.stroke(); }
    for(let j=-60;j<=60;j+=30){ ctx.beginPath(); ctx.moveTo(0,(90-j)/180*H); ctx.lineTo(W,(90-j)/180*H); ctx.stroke(); }
    ctx.strokeStyle='rgba(0,212,255,.3)'; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  }
  CONTINENTS.forEach(ct=>{
    ctx.beginPath();
    ct.p.forEach((pt,i)=>{ const p=projectMap(pt[0],pt[1],W,H); if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath();
    ctx.fillStyle=opts.fill||'rgba(61,122,92,.55)';
    if(opts.stroke){ ctx.strokeStyle=opts.stroke; ctx.lineWidth=1.2; ctx.fill(); ctx.stroke(); }
    else ctx.fill();
  });
}
function pointInPoly(pt,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function randPointInContinent(){
  for(let tries=0;tries<50;tries++){
    const ct=pick(CONTINENTS.filter(c=>c.n!=='Antartika'));
    const p=[rand(-180,180),rand(-85,85)];
    if(pointInPoly(p,ct.p)) return p;
  }
  return [rand(-100,100),rand(-40,40)];
}

/* ---------- Propagasi orbit satelit demo (model sirkular, SIMULATED) ---------- */
function satGround(sat,ts){
  const phase=((sat.norad||1000)%97)/97*6.283;
  const per=(typeof sat.period==='number'?sat.period:100)*60; // detik
  const inc=(sat.incl&&typeof sat.incl==='number'?sat.incl:51)*DEG;
  const t=((ts||Date.now())/1000)%per;
  const th=phase+6.283*(t/per);
  const lat=Math.asin(Math.sin(inc)*Math.sin(th))/DEG;
  let lon=(Math.atan2(Math.cos(inc)*Math.sin(th),Math.cos(th))/DEG) - (t/86400)*360;
  lon=((lon+540)%360)-180;
  return {lat,lon};
}

/* ---------- Tekstur prosedural ---------- */
function makeEarthTexture(){
  const W=2048,H=1024,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b2a4a'); g.addColorStop(.5,'#0f3a66'); g.addColorStop(1,'#0b2a4a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  CONTINENTS.forEach(ct=>{
    ctx.beginPath();
    ct.p.forEach((pt,i)=>{ const p=projectMap(pt[0],pt[1],W,H); if(i===0)ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath(); ctx.fillStyle=ct.c; ctx.fill();
    ctx.strokeStyle='rgba(220,240,220,.18)'; ctx.stroke();
  });
  // es kutub
  ctx.fillStyle='rgba(240,248,255,.85)';
  ctx.fillRect(0,0,W,34); ctx.fillRect(0,H-30,W,30);
  // tekstur noise halus
  for(let i=0;i<2600;i++){
    const x=rand(0,W),y=rand(0,H);
    ctx.fillStyle=`rgba(255,255,255,${rand(.01,.05)})`;
    ctx.fillRect(x,y,rand(1,4),rand(1,4));
  }
  const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=true; return tex;
}
function makeNightTexture(){
  const W=2048,H=1024,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){
    const p=randPointInContinent(), m=projectMap(p[0],p[1],W,H);
    ctx.fillStyle=`rgba(255,214,120,${rand(.25,.9)})`;
    ctx.beginPath(); ctx.arc(m.x,m.y,rand(1,3.4),0,6.283); ctx.fill();
    if(Math.random()<.3){ ctx.beginPath(); ctx.arc(m.x+rand(-6,6),m.y+rand(-4,4),rand(.6,1.6),0,6.283); ctx.fill(); }
  }
  const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=true; return tex;
}
function makeCloudTexture(){
  const W=1024,H=512,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,W,H);
  for(let i=0;i<220;i++){
    const x=rand(0,W),y=rand(40,H-40),r=rand(14,70);
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(255,255,255,${rand(.16,.4)})`); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
  }
  const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=true; return tex;
}
function makeGlowTexture(hex){
